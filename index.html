<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Работен график</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #d1d5db;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --success: #16a34a;
    --warning: #d97706;
    --input: #ffffff;
}

body.dark {
    --bg: #111827;
    --card: #1f2937;
    --text: #f9fafb;
    --muted: #9ca3af;
    --border: #374151;
    --input: #111827;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,.15);
}

.login-box h1 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
}

.login-box label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.login-box input,
.login-box select {
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--input);
    color: var(--text);
}

.login-btn {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    font-weight: bold;
}

.login-btn:hover {
    background: var(--primary-dark);
}

.login-error {
    color: var(--danger);
    text-align: center;
    margin-top: 15px;
    min-height: 20px;
}

/* APP */

#app {
    min-height: 100vh;
}

header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 18px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    max-width: 1500px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.header-title {
    font-size: 20px;
    font-weight: bold;
}

.header-user {
    color: var(--muted);
    font-size: 14px;
}

.header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}

.btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 9px 13px;
    border-radius: 8px;
}

.btn:hover {
    opacity: .85;
}

.btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

.btn-danger {
    background: var(--danger);
    border-color: var(--danger);
    color: white;
}

.btn-success {
    background: var(--success);
    border-color: var(--success);
    color: white;
}

main {
    max-width: 1500px;
    margin: auto;
    padding: 18px;
}

.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 18px;
}

.tab {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 9px;
}

.tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
}

.month-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

.month-title {
    font-size: 20px;
    font-weight: bold;
    text-align: center;
}

.month-buttons {
    display: flex;
    gap: 6px;
}

.schedule-wrapper {
    overflow-x: auto;
}

.schedule-table {
    border-collapse: collapse;
    width: 100%;
    min-width: 900px;
}

.schedule-table th,
.schedule-table td {
    border: 1px solid var(--border);
    padding: 6px;
    text-align: center;
}

.schedule-table th {
    background: rgba(127,127,127,.12);
    position: sticky;
    top: 0;
    z-index: 2;
}

.employee-name {
    min-width: 170px;
    text-align: left !important;
    font-weight: bold;
    position: sticky;
    left: 0;
    background: var(--card);
    z-index: 3;
}

.day-cell {
    min-width: 72px;
    height: 58px;
}

.day-number {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
}

.shift-select {
    width: 100%;
    min-width: 65px;
    padding: 5px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--input);
    color: var(--text);
}

.shift-label {
    font-weight: bold;
    font-size: 13px;
}

.weekend {
    background: rgba(239,68,68,.08);
}

.today {
    outline: 2px solid var(--primary);
    outline-offset: -2px;
}

.admin-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group input,
.form-group select {
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--input);
    color: var(--text);
}

.user-row,
.shift-row,
.request-row {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.row-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.status {
    font-weight: bold;
}

.status.pending {
    color: var(--warning);
}

.status.approved {
    color: var(--success);
}

.status.rejected {
    color: var(--danger);
}

.info {
    color: var(--muted);
    font-size: 14px;
}

@media (max-width: 800px) {
    .admin-grid {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .header-inner {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

/* =========================================================

function loadLoginUsers() {

    const select =
        document.getElementById("loginName");

    select.innerHTML =
        '<option value="">Избери служител</option>';

    USERS

function login() {

    const password =
        document.getElementById("loginPassword").value;

    const error =

        USERS.find(u =>

    currentUser = user;

    error.textContent = "";

    applySavedTheme();

        .getElementById("loginScreen")

function logout() {

/* =========================================================
   THEME
========================================================= */

function applySavedTheme() {

    const key =
        currentUser
            ? "theme_" + currentUser.name
            : "theme_default";

    const dark =
        localStorage.getItem(key) === "dark";

    document.body.classList.toggle(
        "dark",
        dark
    );
}


function toggleDarkMode() {

    if (!currentUser) return;

    const isDark =
        !document.body.classList.contains("dark");

    document.body.classList.toggle(
        "dark",
        isDark
    );

    localStorage.setItem(
        "theme_" + currentUser.name,
        isDark ? "dark" : "light"
    );
}

   TABS

    document

    document
        .getElementById("sectionAll")

];


function changeMonth(amount) {

    currentMonth =
        new Date(
            currentMonth.getFullYear(),
            currentMonth.getMonth() + amount,
            1
        );

    loadSchedule();
}


function getMonthStart() {

    const y =
        currentMonth.getFullYear();

    const m =
        String(
            currentMonth.getMonth() + 1
        ).padStart(2, "0");

    return `${y}-${m}-01`;
}


function getMonthEnd() {

    const date =
        new Date(
            currentMonth.getFullYear(),
            currentMonth.getMonth() + 1,
            0
        );

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function getDaysInMonth() {

    const year =
        currentMonth.getFullYear();

    const month =
        currentMonth.getMonth();

    const count =
        new Date(
            year,
            month + 1,
            0
        ).getDate();

    const days = [];

    for (let i = 1; i <= count; i++) {

        days.push(
            new Date(
                year,
                month,
                i
            )
        );
    }

    return days;
}


/* =========================================================
   SHIFT TYPES
========================================================= */

function loadShiftTypes() {

    try {

        const saved =
            localStorage.getItem(
                "custom_shift_types"
            );

        if (saved) {

            shiftTypes =
                JSON.parse(saved);

        } else {

            shiftTypes =
                [...DEFAULT_SHIFTS];
        }

    } catch {

        shiftTypes =
            [...DEFAULT_SHIFTS];
    }
}


function saveShiftTypes() {

    localStorage.setItem(
        "custom_shift_types",
        JSON.stringify(shiftTypes)
    );
}


function getShiftByName(name) {

    if (!name) return null;

    return shiftTypes.find(
        s => s.name === name
    );
}


/* =========================================================
   SCHEDULE
========================================================= */

async function loadSchedule() {

    updateMonthTitles();

    const start =
        getMonthStart();

    const end =
        getMonthEnd();

    const { data, error } =
        await supabaseClient
            .from("work_schedule")
            .select("*")
            .gte("work_date", start)
            .lte("work_date", end);

    if (error) {

        console.error(error);

        scheduleCache = {};

    } else {

        scheduleCache = {};

        (data || []).forEach(row => {

            scheduleCache[
                row.employee + "|" + row.work_date
            ] = row;
        });
    }

    renderMySchedule();
    renderAllSchedule();
}


function getSchedule(
    employee,
    date
) {

    return scheduleCache[
        employee + "|" + date
    ] || null;
}


function dateToString(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function updateMonthTitles() {

    const title =
        monthNames[
            currentMonth.getMonth()
        ] +
        " " +
        currentMonth.getFullYear();

    document
        .getElementById("monthTitleMy")
        .textContent = title;

    document
        .getElementById("monthTitleAll")
        .textContent = title;
}


/* =========================================================
   MY SCHEDULE
========================================================= */

function renderMySchedule() {

    if (!currentUser) return;

    const days =
        getDaysInMonth();

    const head =
        document.getElementById("myHead");

    const body =
        document.getElementById("myBody");

    head.innerHTML = "";
    body.innerHTML = "";

    let h = "<tr>";
    h += '<th class="employee-name">Служител</th>';

    days.forEach(day => {

        const weekend =
            day.getDay() === 0 ||
            day.getDay() === 6;

        h += `
            <th class="${weekend ? "weekend" : ""}">
                ${day.getDate()}<br>
                <small>${dayNames[day.getDay()]}</small>
            </th>
        `;
    });

    h += "</tr>";

    head.innerHTML = h;

    let row =
        `<tr>
            <td class="employee-name">
                ${escapeHtml(currentUser.name)}
            </td>`;

    days.forEach(day => {

        const date =
            dateToString(day);

        const schedule =
            getSchedule(
                currentUser.name,
                date
            );

        const shift =
            schedule
                ? schedule.shift_type
                : "";

        const weekend =
            day.getDay() === 0 ||
            day.getDay() === 6;

        row += `
            <td class="day-cell ${weekend ? "weekend" : ""}">
                <div class="day-number">
                    ${day.getDate()}
                </div>
                <div class="shift-label">
                    ${escapeHtml(
                        shift || "П"
                    )}
                </div>
            </td>
        `;
    });

    row += "</tr>";

    body.innerHTML = row;
}


/* =========================================================
   ALL SCHEDULE
========================================================= */

function renderAllSchedule() {

    const days =
        getDaysInMonth();

    const head =
        document.getElementById("allHead");

    const body =
        document.getElementById("allBody");

    head.innerHTML = "";
    body.innerHTML = "";

    let h = "<tr>";

    h +=
        '<th class="employee-name">Служител</th>';

    days.forEach(day => {

            day.getDay() === 0 ||

                ${day.getDate()}<br>
                <small>${dayNames[day.getDay()]}</small>
            </th>
        `;

        .filter(user => {

            )

            return true;
        })

                    getSchedule(
                        user.name,

                    );

                        <div class="day-number">

                        </div>
                        <div class="shift-label">
                            ${escapeHtml(
                                shift || "П"
                            )}
                        </div>
                    </td>
                `;
            });

            row += "</tr>";

            body.innerHTML += row;
        });
}


/* =========================================================
   ADMIN
========================================================= */

function renderAdmin() {

    if (!currentUser || !currentUser.admin)
        return;

    renderUsersAdmin();
    renderShiftTypesAdmin();
}


function renderUsersAdmin() {

    const container =
        document.getElementById("usersList");

    container.innerHTML = "";

    USERS.forEach((user, index) => {

        const row =
            document.createElement("div");

        row.className = "user-row";

        row.innerHTML = `
            <div>
                <strong>${escapeHtml(user.name)}</strong>
                <div class="info">
                    ${user.admin ? "Администратор" : "Служител"}
                    ${user.septemberOnly ? " • Само септември" : ""}
                    ${!user.active ? " • НЕАКТИВЕН" : ""}
                </div>
            </div>

            <div class="row-actions">

                <button class="btn"
                        onclick="changeUserPassword(${index})">
                    Смени парола
                </button>

                <button class="btn"
                        onclick="renameUser(${index})">
                    Преименувай
                </button>

                <button class="btn"
                        onclick="toggleUserActive(${index})">
                    ${user.active ? "Деактивирай" : "Активирай"}
                </button>

                ${
                    user.name !== "Петя"
                    ? `
                        <button class="btn btn-danger"
                                onclick="removeUser(${index})">
                            Премахни
                        </button>
                    `
                    : ""
                }

            </div>
        `;

        container.appendChild(row);
    });
}


function addUser() {

    if (!currentUser?.admin)
        return;

    const name =
        document
            .getElementById("newUserName")
            .value
            .trim();

    const password =
        document
            .getElementById("newUserPassword")
            .value;

    const admin =
        document
            .getElementById("newUserAdmin")
            .checked;

    const septemberOnly =
        document
            .getElementById("newUserSeptember")
            .checked;

    if (!name) {

        alert("Въведи име.");
        return;
    }

    if (
        USERS.some(
            u =>
                u.name.toLowerCase() ===
                name.toLowerCase()
        )
    ) {

        alert("Този потребител вече съществува.");
        return;
    }

    USERS.push({

        name,
        password,
        admin,
        active: true,
        septemberOnly

    });

    document
        .getElementById("newUserName")
        .value = "";

    document
        .getElementById("newUserPassword")
        .value = "";

    document
        .getElementById("newUserAdmin")
        .checked = false;

    document
        .getElementById("newUserSeptember")
        .checked = false;

    loadLoginUsers();
    renderUsersAdmin();

    alert(
        "Потребителят е добавен.\n\n" +
        "Важно: понеже потребителите са записани директно в HTML, " +
        "за постоянно запазване трябва да промениш USERS в index.html."
    );
}


function changeUserPassword(index) {

    const password =
        prompt(
            "Нова парола за " +
            USERS[index].name
        );

    if (password === null)
        return;

    USERS[index].password =
        password;

    alert(
        "Паролата е променена в текущата версия на страницата.\n\n" +
        "За постоянно запазване трябва да бъде записана в USERS в index.html."
    );
}


function renameUser(index) {

    const name =
        prompt(
            "Ново име:",
            USERS[index].name
        );

    if (!name || !name.trim())
        return;

    USERS[index].name =
        name.trim();

    loadLoginUsers();
    renderUsersAdmin();
}


function toggleUserActive(index) {

    if (
        USERS[index].name === "Петя"
    ) {
        alert("Петя не може да бъде деактивирана.");
        return;
    }

    USERS[index].active =
        !USERS[index].active;

    loadLoginUsers();
    renderUsersAdmin();
}


function removeUser(index) {

    if (
        !confirm(
            "Наистина ли искаш да премахнеш " +
            USERS[index].name +
            "?"
        )
    )
        return;

    USERS.splice(index, 1);

    loadLoginUsers();
    renderUsersAdmin();
}


/* =========================================================
   SHIFT ADMIN
========================================================= */

function renderShiftTypesAdmin() {

    const container =
        document.getElementById(
            "shiftTypesList"
        );

    container.innerHTML = "";

    shiftTypes.forEach((shift, index) => {

        const row =
            document.createElement("div");

        row.className = "shift-row";

        row.innerHTML = `

            <div>
                <strong>
                    ${escapeHtml(shift.name)}
                </strong>

                <div class="info">
                    ${
                        shift.start && shift.end
                            ? `${shift.start} – ${shift.end}, почивка ${shift.break} мин.`
                            : "Без часови диапазон"
                    }

                    ${!shift.active ? " • НЕАКТИВНА" : ""}
                </div>
            </div>

            <div class="row-actions">

                <button class="btn"
                        onclick="editShiftType(${index})">
                    Редактирай
                </button>

                <button class="btn"

                    ${
                        shift.active
                            ? "Деактивирай"
                            : "Активирай"
                    }
                </button>

                <button class="btn btn-danger"

                    Премахни
                </button>

            </div>
        `;

        container.appendChild(row);
    });
}


function addShiftType() {

    const name =
        document
            .getElementById("newShiftName")
            .value
            .trim();

    const start =
        document
            .getElementById("newShiftStart")
            .value || null;

    const end =
        document
            .getElementById("newShiftEnd")
            .value || null;

    const breakMinutes =
        Number(
            document
                .getElementById("newShiftBreak")
                .value || 0
        );

    if (!name) {

        alert("Въведи име на смяната.");
        return;
    }

    if (
        shiftTypes.some(
            s =>
                s.name.toLowerCase() ===
                name.toLowerCase()
        )
    ) {

        alert("Този тип смяна вече съществува.");
        return;
    }

    shiftTypes.push({

        id:
            "custom_" +
            Date.now(),

        name,

        start,

        end,

        break: breakMinutes,

        active: true

    });

    saveShiftTypes();

    document
        .getElementById("newShiftName")
        .value = "";

    document
        .getElementById("newShiftStart")
        .value = "";

    document
        .getElementById("newShiftEnd")
        .value = "";

    document
        .getElementById("newShiftBreak")
        .value = "60";

    renderShiftTypesAdmin();
}


function editShiftType(index) {

    const shift =
        shiftTypes[index];

    const name =
        prompt(
            "Име на смяната:",
            shift.name
        );

    if (!name)
        return;

    const start =
        prompt(
            "Начало:",
            shift.start || ""
        );

    const end =
        prompt(
            "Край:",
            shift.end || ""
        );

    const breakMinutes =
        prompt(
            "Почивка в минути:",
            shift.break
        );

    shift.name =
        name.trim();

    shift.start =
        start || null;

    shift.end =
        end || null;

    shift.break =
        Number(breakMinutes || 0);

    saveShiftTypes();

    renderShiftTypesAdmin();
}


function toggleShiftType(index) {

    shiftTypes[index].active =
        !shiftTypes[index].active;

    saveShiftTypes();

    renderShiftTypesAdmin();
}


function removeShiftType(index) {

    if (
        !confirm(
            "Да се премахне ли този тип смяна?"
        )
    )
        return;

    shiftTypes.splice(index, 1);

    saveShiftTypes();

    renderShiftTypesAdmin();
}


/* =========================================================
   REQUESTS
========================================================= */

async function loadRequests() {

    if (!currentUser)
        return;

    const { data, error } =
        await supabaseClient
            .from("shift_requests")
            .select("*")
            .order(
                "created_at",
                { ascending: false }
            );

    if (error) {

        console.error(error);

        requestsCache = [];

    } else {

        requestsCache =
            data || [];
    }

    renderRequests();
    fillReceiverSelect();
}


function fillReceiverSelect() {

    const select =
        document.getElementById(
            "swapReceiver"
        );

    if (!select)
        return;

    select.innerHTML =
        '<option value="">Избери служител</option>';

    USERS
        .filter(u =>
            u.active &&
            u.name !== currentUser.name
        )
        .forEach(user => {

            const option =
                document.createElement("option");

            option.value =
                user.name;

            option.textContent =
                user.name;

            select.appendChild(option);
        });
}


async function sendSwapRequest() {

    if (!currentUser)
        return;

    const proposerDate =
        document
            .getElementById("swapMyDate")
            .value;

    const receiver =
        document
            .getElementById("swapReceiver")
            .value;

    const receiverDate =
        document
            .getElementById("swapReceiverDate")
            .value;

    const message =
        document
            .getElementById("swapMessage")
            .value
            .trim();

    if (
        !proposerDate ||
        !receiver ||
        !receiverDate
    ) {

        alert(
            "Попълни всички задължителни полета."
        );

        return;
    }

    const { error } =
        await supabaseClient
            .from("shift_requests")
            .insert({

                proposer:
                    currentUser.name,

                receiver,

                proposer_date:
                    proposerDate,

                receiver_date:
                    receiverDate,

                message,

                status:
                    "pending"

            });

    if (error) {

        console.error(error);

        alert(
            "Грешка при изпращането на заявката."
        );

        return;
    }

    document
        .getElementById("swapMyDate")
        .value = "";

    document
        .getElementById("swapReceiver")
        .value = "";

    document
        .getElementById("swapReceiverDate")
        .value = "";

    document
        .getElementById("swapMessage")
        .value = "";

    await loadRequests();

    alert("Заявката е изпратена.");
}


function renderRequests() {

    const container =
        document.getElementById(
            "requestsList"
        );

    if (!container)
        return;

    if (!requestsCache.length) {

        container.innerHTML =
            '<div class="info">Няма заявки.</div>';

        return;
    }

    container.innerHTML = "";

    requestsCache.forEach(req => {

        const row =
            document.createElement("div");

        row.className =
            "request-row";

        let statusClass =
            "";

        if (req.status === "pending")
            statusClass = "pending";

        if (req.status === "approved")
            statusClass = "approved";

        if (req.status === "rejected")
            statusClass = "rejected";

        let actions = "";

        if (
            req.receiver === currentUser.name &&
            req.status === "pending"
        ) {

            actions += `
                <button class="btn btn-success"
                        onclick="receiverDecision(${req.id}, 'accepted')">
                    Приеми
                </button>

                <button class="btn btn-danger"
                        onclick="receiverDecision(${req.id}, 'rejected')">
                    Откажи
                </button>
            `;
        }

        if (
            currentUser.admin &&
            req.status === "accepted"
        ) {

            actions += `
                <button class="btn btn-success"
                        onclick="adminDecision(${req.id}, 'approved')">
                    Одобри
                </button>

                <button class="btn btn-danger"
                        onclick="adminDecision(${req.id}, 'rejected')">
                    Откажи
                </button>
            `;
        }

        row.innerHTML = `

            <div>
                <strong>
                    ${escapeHtml(req.proposer)}
                </strong>

                → 

                <strong>
                    ${escapeHtml(req.receiver)}
                </strong>

                <div class="info">
                    ${req.proposer_date}
                    ↔
                    ${req.receiver_date}
                </div>

                ${
                    req.message
                    ? `<div>${escapeHtml(req.message)}</div>`
                    : ""
                }

                <div class="status ${statusClass}">
                    Статус: ${escapeHtml(req.status)}
                </div>
            </div>

            <div class="row-actions">
                ${actions}
            </div>
        `;

        container.appendChild(row);
    });
}


async function receiverDecision(
    id,
    decision
) {

    const { error } =
        await supabaseClient
            .from("shift_requests")
            .update({

                status:
                    decision,

                receiver_response_at:
                    new Date().toISOString()

            })
            .eq("id", id);

    if (error) {

        console.error(error);

        alert("Грешка.");
        return;
    }

    await loadRequests();
}


async function adminDecision(
    id,
    decision
) {

    const request =
        requestsCache.find(
            r => Number(r.id) === Number(id)
        );

    if (!request)
        return;

    if (decision === "approved") {

        const first =
            getSchedule(
                request.proposer,
                request.proposer_date
            );

        const second =
            getSchedule(
                request.receiver,
                request.receiver_date
            );

        await saveScheduleRow(
            request.proposer,
            request.proposer_date,
            second
        );

        await saveScheduleRow(
            request.receiver,
            request.receiver_date,
            first
        );
    }

    const { error } =
        await supabaseClient
            .from("shift_requests")
            .update({

                status:
                    decision,

                admin_decision_at:
                    new Date().toISOString()

            })
            .eq("id", id);

    if (error) {

        console.error(error);

        alert("Грешка.");
        return;
    }

    await loadSchedule();
    await loadRequests();
}


async function saveScheduleRow(
    employee,
    date,
    sourceRow
) {

    const shiftType =
        sourceRow
            ? sourceRow.shift_type
            : null;

    const shift =
        getShiftByName(
            shiftType
        );

    const values = {

        employee,

        work_date: date,

        shift_type:
            shiftType || null,

        start_time:
            shift?.start || null,

        end_time:
            shift?.end || null,

        break_time:
            shift?.break ?? 0,

        updated_at:
            new Date().toISOString()

    };

    const { error } =
        await supabaseClient
            .from("work_schedule")
            .upsert(
                values,
                {
                    onConflict:
                        "employee,work_date"
                }
            );

    if (error)
        console.error(error);
}


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadLoginUsers();

        loadShiftTypes();

        const savedUser =
            localStorage.getItem(
                "work_schedule_user"
            );

        if (savedUser) {

            const user =
                USERS.find(
                    u =>
                        u.name === savedUser &&
                        u.active
                );

            if (user) {

                currentUser = user;

                document
                    .getElementById("loginName")
                    .value = user.name;

                document
                    .getElementById("loginScreen")
                    .classList.add("hidden");

                document
                    .getElementById("app")
                    .classList.remove("hidden");

                document
                    .getElementById("currentUserText")
                    .textContent =
                    "Влезли сте като: " +
                    user.name;

                document
                    .getElementById("tabAdmin")
                    .classList.toggle(
                        "hidden",
                        !user.admin
                    );

                applySavedTheme();

                loadSchedule();

                loadRequests();

            }
        }

        document
            .getElementById("loginPassword")
            .addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter"
                    ) {
                        login();
                    }
                }
            );
    }
);
