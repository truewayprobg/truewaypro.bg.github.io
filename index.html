<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Работен график</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #d1d5db;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --danger: #dc2626;
    --success: #16a34a;
    --warning: #d97706;
    --shadow: 0 4px 20px rgba(0,0,0,.08);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================
   LOGIN
========================= */

#loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    padding: 35px;
    border-radius: 18px;
    box-shadow: var(--shadow);
}

.login-box h1 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 8px;
}

.login-box p {
    text-align: center;
    color: var(--muted);
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: white;
}

.login-button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 9px;
    background: var(--primary);
    color: white;
    font-weight: bold;
}

.login-button:hover {
    background: var(--primary-hover);
}

.login-error {
    color: var(--danger);
    text-align: center;
    margin-top: 15px;
}

/* =========================
   APP
========================= */

#appPage {
    min-height: 100vh;
}

.topbar {
    background: #111827;
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
}

.topbar-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.topbar h1 {
    margin: 0;
    font-size: 20px;
}

.user-info {
    color: #d1d5db;
    font-size: 14px;
}

.topbar-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.topbar button {
    border: 0;
    border-radius: 7px;
    padding: 8px 12px;
}

.logout-btn {
    background: #dc2626;
    color: white;
}

.theme-btn {
    background: #374151;
    color: white;
}

/* =========================
   CONTENT
========================= */

.container {
    max-width: 1600px;
    margin: 0 auto;
    padding: 20px;
}

.toolbar {
    background: var(--card);
    padding: 15px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.toolbar-left,
.toolbar-right {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}

.toolbar select,
.toolbar button {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
}

.primary-btn {
    background: var(--primary) !important;
    color: white;
    border-color: var(--primary) !important;
}

.success-btn {
    background: var(--success) !important;
    color: white;
    border-color: var(--success) !important;
}

.danger-btn {
    background: var(--danger) !important;
    color: white;
    border-color: var(--danger) !important;
}

/* =========================
   TABS
========================= */

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.tab-button {
    padding: 10px 16px;
    border: 0;
    border-radius: 8px;
    background: #e5e7eb;
}

.tab-button.active {
    background: var(--primary);
    color: white;
}

/* =========================
   SCHEDULE
========================= */

.schedule-card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
}

.table-wrapper {
    overflow-x: auto;
}

.schedule-table {
    border-collapse: collapse;
    width: 100%;
    min-width: 900px;
}

.schedule-table th,
.schedule-table td {
    border: 1px solid var(--border);
    padding: 6px;
    text-align: center;
}

.schedule-table th {
    background: #e5e7eb;
    font-size: 13px;
}

.schedule-table .employee-cell {
    position: sticky;
    left: 0;
    z-index: 3;
    background: var(--card);
    text-align: left;
    font-weight: bold;
    min-width: 190px;
}

.schedule-table th.employee-cell {
    background: #e5e7eb;
}

.day-header {
    min-width: 105px;
}

.weekend {
    background: #fef2f2 !important;
}

.date-number {
    font-size: 15px;
    font-weight: bold;
}

.day-name {
    font-size: 11px;
    color: var(--muted);
}

.shift-box {
    min-height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    font-weight: bold;
    font-size: 13px;
}

.shift-work {
    background: #dcfce7;
    color: #166534;
}

.shift-first {
    background: #dbeafe;
    color: #1e40af;
}

.shift-second {
    background: #ede9fe;
    color: #5b21b6;
}

.shift-regular {
    background: #fef3c7;
    color: #92400e;
}

.shift-full {
    background: #fee2e2;
    color: #991b1b;
}

.shift-leave {
    background: #cffafe;
    color: #155e75;
}

.shift-absent {
    background: #fce7f3;
    color: #9d174d;
}

.shift-rest {
    background: #f3f4f6;
    color: #6b7280;
}

/* =========================
   ADMIN SELECT
========================= */

.admin-select {
    width: 100%;
    min-width: 95px;
    padding: 7px 4px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: white;
    font-size: 12px;
}

.admin-select.changed {
    border: 2px solid var(--warning);
    background: #fffbeb;
}

.save-info {
    font-size: 13px;
    color: var(--muted);
}

/* =========================
   CARDS
========================= */

.info-card {
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
}

.info-card h2 {
    margin-top: 0;
}

/* =========================
   REQUESTS
========================= */

.request {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px;
    margin-bottom: 10px;
}

.request-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

/* =========================
   DARK MODE
========================= */

body.dark {
    --bg: #111827;
    --card: #1f2937;
    --text: #f9fafb;
    --muted: #9ca3af;
    --border: #374151;
}

body.dark .form-group input,
body.dark .form-group select,
body.dark .toolbar select,
body.dark .toolbar button,
body.dark .admin-select {
    background: #111827;
    color: white;
}

body.dark .schedule-table th {
    background: #374151;
}

body.dark .schedule-table .employee-cell {
    background: #1f2937;
}

body.dark .tab-button {
    background: #374151;
    color: white;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .container {
        padding: 10px;
    }

    .login-box {
        padding: 25px;
    }

    .topbar {
        padding: 12px;
    }

    .topbar h1 {
        font-size: 17px;
    }

    .toolbar {
        align-items: stretch;
    }

    .toolbar-left,
    .toolbar-right {
        width: 100%;
    }

    .toolbar select,
    .toolbar button {
        flex: 1;
    }
}

</style>
</head>

<!-- =========================================================

========================================================= -->

<div

>

        <div class="topbar-buttons">

             TABS

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://feahxunujegspmfgicfw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qtFfI15FcRdBcUzTW56Jg_bGXHiLgR";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   GLOBAL STATE
========================================================= */

let users = [];

let scheduleData = {};

let currentUser = null;

let currentDate = new Date();

let currentMonth =
    currentDate.getMonth();

let currentYear =
    currentDate.getFullYear();


/* =========================================================
   SHIFT TYPES
========================================================= */

const SHIFT_TYPES = {

    "П": {
        label: "Почивка",
        start: null,
        end: null,
        break: 0,
        className: "shift-rest"
    },

    "1-ва смяна": {
        label: "1-ва смяна",
        start: "09:00",
        end: "16:00",
        break: 60,
        className: "shift-first"
    },

    "2-ра смяна": {
        label: "2-ра смяна",
        start: "14:00",
        end: "21:00",
        break: 60,
        className: "shift-second"
    },

    "Р": {
        label: "Р",
        start: "09:00",
        end: "18:00",
        break: 60,
        className: "shift-regular"
    },

    "Ц": {
        label: "Ц",
        start: "09:00",
        end: "21:00",
        break: 60,
        className: "shift-full"
    },

    "Отпуска": {
        label: "Отпуска",
        start: null,
        end: null,
        break: 0,
        className: "shift-leave"
    },

    "Самоотлъчка": {
        label: "Самоотлъчка",
        start: null,
        end: null,
        break: 0,
        className: "shift-absent"
    }

};


/* =========================================================
   DOM
========================================================= */

const loginPage =
    document.getElementById("loginPage");

const appPage =
    document.getElementById("appPage");

const loginName =
    document.getElementById("loginName");

const loginPassword =
    document.getElementById("loginPassword");

const loginButton =
    document.getElementById("loginButton");

const loginError =
    document.getElementById("loginError");

const loggedUser =
    document.getElementById("loggedUser");

const logoutButton =
    document.getElementById("logoutButton");

const themeButton =
    document.getElementById("themeButton");

const monthSelect =
    document.getElementById("monthSelect");

const yearSelect =
    document.getElementById("yearSelect");

const scheduleHead =
    document.getElementById("scheduleHead");

const scheduleBody =
    document.getElementById("scheduleBody");

const adminTabButton =
    document.getElementById("adminTabButton");

const adminMonthSelect =
    document.getElementById("adminMonthSelect");

const adminYearSelect =
    document.getElementById("adminYearSelect");

const adminScheduleHead =
    document.getElementById("adminScheduleHead");

const adminScheduleBody =
    document.getElementById("adminScheduleBody");


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function formatSupabaseError(error) {

    if (!error) {
        return "Неизвестна грешка.";
    }

    return [
        error.message
            ? "Съобщение: " + error.message
            : "",

        error.details
            ? "Детайли: " + error.details
            : "",

        error.hint
            ? "Подсказка: " + error.hint
            : "",

        error.code
            ? "Код: " + error.code
            : ""

    ]
    .filter(Boolean)
    .join("\n");

}


function getDaysInMonth(year, month) {

    return new Date(
        year,
        month + 1,
        0
    ).getDate();

}


function dateKey(employee, date) {

    return employee + "|" + date;

}


function makeDate(year, month, day) {

    return (
        year +
        "-" +
        String(month + 1).padStart(2, "0") +
        "-" +
        String(day).padStart(2, "0")
    );

}


function getDayName(dateString) {

    const date =
        new Date(dateString + "T00:00:00");

    return [
        "Нед",
        "Пон",
        "Вто",
        "Сря",
        "Чет",
        "Пет",
        "Съб"
    ][date.getDay()];

}


function isWeekend(dateString) {

    const date =
        new Date(dateString + "T00:00:00");

    const day =
        date.getDay();

    return day === 0 || day === 6;

}


function getShift(shiftName) {

    return SHIFT_TYPES[shiftName] || null;

}


/* =========================================================
   LOAD USERS
========================================================= */

async function loadUsers() {

    const {
        data,
        error
    } = await supabaseClient
        .from("app_users")
        .select("id,name,password,admin,active")
        .eq("active", true)
        .order("name");

    if (error) {

        console.error(error);

        loginError.textContent =
            "Грешка при зареждане на служителите.";

        return;

    }

    users = data || [];

    loginName.innerHTML =
        '<option value="">Избери име</option>';

    users.forEach(user => {

        const option =
            document.createElement("option");

        option.value =
            user.name;

        option.textContent =
            user.name;

        loginName.appendChild(option);

    });

    fillEmployeeSelect();

}


/* =========================================================
   EMPLOYEE SELECT
========================================================= */

function fillEmployeeSelect() {

    const select =
        document.getElementById("swapEmployee");

    if (!select) return;

    select.innerHTML =
        '<option value="">Избери служител</option>';

    users
        .filter(user =>
            !currentUser ||
            user.name !== currentUser.name
        )
        .forEach(user => {

            const option =
                document.createElement("option");

            option.value =
                user.name;

            option.textContent =
                user.name;

            select.appendChild(option);

        });

}


/* =========================================================
   LOGIN
========================================================= */

async function login() {

    loginError.textContent = "";

    const name =
        loginName.value;

    const password =
        loginPassword.value;

    if (!name || !password) {

        loginError.textContent =
            "Моля, въведи име и парола.";

        return;

    }

    const user =
        users.find(
            item =>
                item.name === name &&
                item.password === password
        );

    if (!user) {

        loginError.textContent =
            "Грешно име или парола.";

        return;

    }

    currentUser = user;

    sessionStorage.setItem(
        "workScheduleUser",
        JSON.stringify(user)
    );

    showApp();

}


/* =========================================================
   SHOW APP
========================================================= */

async function showApp() {

    loginPage.classList.add("hidden");

    appPage.classList.remove("hidden");

    loggedUser.textContent =
        currentUser.admin
            ? currentUser.name + " · Администратор"
            : currentUser.name;

    if (currentUser.admin) {

        adminTabButton.classList.remove("hidden");

    } else {

        adminTabButton.classList.add("hidden");

    }

    fillEmployeeSelect();

    setupMonthSelectors();

    await loadSchedule();

    renderSchedule();

    renderMySchedule();

    if (currentUser.admin) {

        renderAdminSchedule();

        await loadRequests();

    }

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    sessionStorage.removeItem(
        "workScheduleUser"
    );

    currentUser = null;

    appPage.classList.add("hidden");

    loginPage.classList.remove("hidden");

    loginPassword.value = "";

}


/* =========================================================
   MONTH SELECTORS
========================================================= */

function setupMonthSelectors() {

    const months = [
        "Януари",
        "Февруари",
        "Март",
        "Април",
        "Май",
        "Юни",
        "Юли",
        "Август",
        "Септември",
        "Октомври",
        "Ноември",
        "Декември"
    ];

    monthSelect.innerHTML = "";

    adminMonthSelect.innerHTML = "";

    months.forEach(
        (month, index) => {

            const option1 =
                document.createElement("option");

            option1.value = index;

            option1.textContent = month;

            monthSelect.appendChild(option1);


            const option2 =
                document.createElement("option");

            option2.value = index;

            option2.textContent = month;

            adminMonthSelect.appendChild(option2);

        }

/* =========================================================
   MY SCHEDULE
========================================================= */

function renderMySchedule() {

    if (!currentUser) return;

    const days =
        getDaysInMonth(
            currentYear,
            currentMonth
        );

    let head =
        '<tr><th class="employee-cell">Дата</th><th>Ден</th><th>Смяна</th><th>Часове</th></tr>';

    document.getElementById(
        "myScheduleHead"
    ).innerHTML = head;

    let body = "";

    let totalMinutes = 0;

    for (
        let day = 1;
        day <= days;
        day++
    ) {

        const date =
            makeDate(
                currentYear,
                currentMonth,
                day
            );

        const row =
            scheduleData[
                dateKey(
                    currentUser.name,
                    date
                )
            ];

        const shift =
            row?.shift_type || "П";

        const shiftInfo =
            getShift(shift);

        let hoursText = "-";

        if (
            shiftInfo &&
            shiftInfo.start &&
            shiftInfo.end
        ) {

            const start =
                shiftInfo.start
                    .split(":")
                    .map(Number);

            const end =
                shiftInfo.end
                    .split(":")
                    .map(Number);

            let minutes =
                (end[0] * 60 + end[1]) -
                (start[0] * 60 + start[1]) -
                shiftInfo.break;

            if (minutes < 0) {
                minutes = 0;
            }

            totalMinutes += minutes;

            hoursText =
                (minutes / 60)
                    .toFixed(2)
                    .replace(".", ",") +
                " ч.";
        }

        const weekend =
            isWeekend(date)
                ? "weekend"
                : "";

        body += `
            <tr>

                <td class="${weekend}">
                    ${date}
                </td>

                <td class="${weekend}">
                    ${getDayName(date)}
                </td>

                <td class="${weekend}">
                    <strong>
                        ${escapeHtml(shift)}
                    </strong>
                </td>

                <td class="${weekend}">
                    ${hoursText}
                </td>

            </tr>
        `;

    }

    document.getElementById(
        "myScheduleBody"
    ).innerHTML = body;


    const totalHours =
        totalMinutes / 60;

    document.getElementById(
        "myScheduleInfo"
    ).innerHTML = `
        <p>
            <strong>Служител:</strong>
            ${escapeHtml(currentUser.name)}
        </p>

        <p>
            <strong>Общо работни часове:</strong>
            ${totalHours
                .toFixed(2)
                .replace(".", ",")} ч.
        </p>
    `;

}

/* =========================================================
   SAVE ONE CELL
========================================================= */

async function saveScheduleCell(
    employee,
    date,
    shiftName
) {

    /*
        Празната клетка означава почивка.
        Изтриваме стария запис вместо да записваме NULL.
    */

    if (!shiftName) {

        const {
            error
        } = await supabaseClient
            .from("work_schedule")
            .delete()
            .eq("employee", employee)
            .eq("work_date", date);

        if (error) {
            throw error;
        }

        return;

    }


    const shift =
        getShift(shiftName);

    if (!shift) {

        throw new Error(
            "Невалидна смяна: " +
            shiftName
        );

    }


    const payload = {

        employee: employee,

        work_date: date,

        shift_type: shiftName,

        start_time:
            shift.start,

        end_time:
            shift.end,

        break_time:
            shift.break

    };


    /*
        Първо проверяваме дали вече има запис.
        Така не зависим от ON CONFLICT.
    */

    const {
        data: existing,
        error: findError
    } = await supabaseClient
        .from("work_schedule")
        .select("employee,work_date")
        .eq("employee", employee)
        .eq("work_date", date)
        .limit(1);

    if (findError) {
        throw findError;
    }


    if (
        existing &&
        existing.length > 0
    ) {

        const {
            error
        } = await supabaseClient
            .from("work_schedule")
            .update(payload)
            .eq("employee", employee)
            .eq("work_date", date);

        if (error) {
            throw error;
        }

    } else {

        const {
            error
        } = await supabaseClient
            .from("work_schedule")
            .insert(payload);

        if (error) {
            throw error;
        }

    }

}


/* =========================================================
   SAVE ALL CHANGES
========================================================= */

async function saveAllScheduleChanges() {

    if (!currentUser?.admin) {
        return;
    }

    const scrollX =
        window.scrollX;

    const scrollY =
        window.scrollY;


    const selects =
        Array.from(
            document.querySelectorAll(
                ".admin-select"
            )
        );


    const changed =
        selects.filter(
            select =>
                select.value !==
                (select.dataset.original || "")
        );


    if (changed.length === 0) {

        alert(
            "Няма промени за записване."
        );

        return;

    }


    const button =
        document.getElementById(
            "saveScheduleButton"
        );

    button.disabled = true;

    button.textContent =
        "⏳ Записване...";


    try {

        let saved = 0;

        for (const select of changed) {

            const employee =
                select.dataset.employee;

            const date =
                select.dataset.date;

            const shift =
                select.value;

            await saveScheduleCell(
                employee,
                date,
                shift
            );


            /*
                Обновяваме локалните данни.
            */

            const key =
                dateKey(
                    employee,
                    date
                );


            if (!shift) {

                delete scheduleData[key];

            } else {

                const info =
                    getShift(shift);

                scheduleData[key] = {

                    employee,

                    work_date: date,

                    shift_type: shift,

                    start_time:
                        info?.start || null,

                    end_time:
                        info?.end || null,

                    break_time:
                        info?.break || 0

                };

            }


            select.dataset.original =
                shift;

            select.classList.remove(
                "changed"
            );

            saved++;

        }


        /*
            Записано успешно.
        */

        renderSchedule();

        renderMySchedule();

        window.scrollTo(
            scrollX,
            scrollY
        );

        alert(
            `Успешно записани промени: ${saved}`
        );


    } catch (error) {

        console.error(
            "SAVE ERROR:",
            error
        );

        alert(
            "Грешка при запис на промените:\n\n" +
            formatSupabaseError(error)
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "💾 Запази промените";

    }

}

async function sendSwapRequest() {

    if (!currentUser) return;

    const date =
        document.getElementById(
            "swapDate"
        ).value;

    const toEmployee =
        document.getElementById(
            "swapEmployee"
        ).value;

    const message =
        document.getElementById(
            "swapMessage"
        ).value.trim();


    if (!date || !toEmployee) {

        alert(
            "Избери дата и служител."
        );

        return;

    }


    const row =
        scheduleData[
            dateKey(
                currentUser.name,
                date
            )
        ];


    if (!row?.shift_type) {

        alert(
            "На тази дата нямаш въведена смяна."
        );

        return;

    }


    const {
        error
    } = await supabaseClient
        .from("shift_requests")
        .insert({

            from_employee:
                currentUser.name,

            to_employee:
                toEmployee,

            work_date:
                date,

            shift_type:
                row.shift_type,

            message:
                message,

            status:
                "pending"

        });


    if (error) {

        alert(
            "Грешка при изпращане:\n\n" +
            formatSupabaseError(error)
        );

        return;

    }


    document.getElementById(
        "swapMessage"
    ).value = "";

    alert(
        "Заявката е изпратена."
    );

    await loadRequests();

}


/* =========================================================
   LOAD REQUESTS
========================================================= */

async function loadRequests() {

    if (!currentUser) return;


    let query =
        supabaseClient
            .from("shift_requests")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (!currentUser.admin) {

        query =
            query.or(
                `from_employee.eq.${currentUser.name},to_employee.eq.${currentUser.name}`
            );

    }


    const {
        data,
        error
    } = await query;


    if (error) {

        console.error(error);

        document.getElementById(
            "requestsList"
        ).innerHTML =
            "<p>Грешка при зареждане на заявките.</p>";

        return;

    }


    const container =
        document.getElementById(
            "requestsList"
        );


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p>Няма заявки.</p>";

        return;

    }


    container.innerHTML =
        data.map(request => {

            let buttons = "";

            if (
                request.status === "pending" &&
                currentUser.admin
            ) {

                buttons = `
                    <div class="request-actions">

                        <button
                            class="success-btn"
                            onclick="approveRequest(${request.id})"
                        >
                            ✓ Одобри
                        </button>

                        <button
                            class="danger-btn"
                            onclick="rejectRequest(${request.id})"
                        >
                            ✕ Откажи
                        </button>

                    </div>
                `;

            }


            return `
                <div class="request">

                    <strong>
                        ${escapeHtml(
                            request.from_employee
                        )}
                    </strong>

                    →
                    
                    <strong>
                        ${escapeHtml(
                            request.to_employee
                        )}
                    </strong>

                    <br>

                    Дата:
                    ${escapeHtml(
                        request.work_date
                    )}

                    <br>

                    Смяна:
                    ${escapeHtml(
                        request.shift_type || "-"
                    )}

                    <br>

                    Статус:
                    <strong>
                        ${escapeHtml(
                            request.status
                        )}
                    </strong>

                    ${
                        request.message
                            ? `<br>Съобщение: ${escapeHtml(request.message)}`
                            : ""
                    }

                    ${buttons}

                </div>
            `;

        })
        .join("");

}


/* =========================================================
   APPROVE REQUEST
========================================================= */

async function approveRequest(id) {

    if (!currentUser?.admin) {
        return;
    }


    const {
        data: request,
        error: requestError
    } = await supabaseClient
        .from("shift_requests")
        .select("*")
        .eq("id", id)
        .single();


    if (requestError) {

        alert(
            formatSupabaseError(
                requestError
            )
        );

        return;

    }


    const sourceKey =
        dateKey(
            request.from_employee,
            request.work_date
        );


    const targetKey =
        dateKey(
            request.to_employee,
            request.work_date
        );


    const source =
        scheduleData[sourceKey];


    if (!source) {

        alert(
            "Оригиналната смяна вече не съществува."
        );

        return;

    }


    /*
        Даваме смяната на получателя.
    */

    try {

        await saveScheduleCell(
            request.to_employee,
            request.work_date,
            source.shift_type
        );


        await saveScheduleCell(
            request.from_employee,
            request.work_date,
            ""
        );


        const {
            error
        } = await supabaseClient
            .from("shift_requests")
            .update({
                status: "approved"
            })
            .eq("id", id);


        if (error) {
            throw error;
        }


        alert(
            "Заявката е одобрена."
        );


        await loadSchedule();

        renderSchedule();

        renderMySchedule();

        renderAdminSchedule();

        await loadRequests();


    } catch (error) {

        alert(
            "Грешка при одобряване:\n\n" +
            formatSupabaseError(error)
        );

    }

}


/* =========================================================
   REJECT REQUEST
========================================================= */

async function rejectRequest(id) {

    if (!currentUser?.admin) {

    const {
        error
    } = await supabaseClient

    if (error) {
