function dateKey(year, month, day) {
    return `${String(day).padStart(2, "0")}.${String(month).padStart(2, "0")}.${year}`;
}

function toDbDate(date) {
    const parts = date.split(".");
    return `${parts[2]}-${parts[1]}-${parts[0]}`;
}

function fromDbDate(date) {
    const parts = date.split("-");
    return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

function daysInMonth(year, month) {
    return new Date(year, month, 0).getDate();
}

function getMonthDates(year, month) {
    const result = [];
    const days = daysInMonth(year, month);

    for (let d = 1; d <= days; d++) {
        result.push({
            date: dateKey(year, month, d),
            day: d,
            weekday: new Date(year, month - 1, d)
                .toLocaleDateString("bg-BG", { weekday: "short" })
        });
    }

    return result;
}

function emptyShift() {
    return {
        type: "",
        start: "",
        end: "",
        break: ""
    };
}

function ensureScheduleStructure() {
    employees.forEach(employee => {
        if (!schedules[employee]) schedules[employee] = {};

        for (const month of months) {
            for (const item of getMonthDates(month.year, month.month)) {
                if (!schedules[employee][item.date]) {
                    schedules[employee][item.date] = emptyShift();
                }
            }
        }
    });
}

function copyDefaults() {
    schedules = {};

    employees.forEach(employee => {
        schedules[employee] = {};

        for (const month of months) {
            for (const item of getMonthDates(month.year, month.month)) {
                schedules[employee][item.date] = emptyShift();
            }
        }
    });

    Object.entries(defaultSchedules).forEach(([employee, dates]) => {
        Object.entries(dates).forEach(([date, shift]) => {
            schedules[employee][date] = { ...shift };
        });
    });
}

async function saveAllSchedules() {
    const rows = [];

    employees.forEach(employee => {
        for (const month of months) {
            for (const item of getMonthDates(month.year, month.month)) {
                const shift = schedules[employee]?.[item.date] || emptyShift();

                rows.push({
                    employee: employee,
                    work_date: toDbDate(item.date),
                    shift_type: shift.type || "",
                    start_time: shift.start || "",
                    end_time: shift.end || "",
                    break_time: shift.break || "",
                    updated_at: new Date().toISOString()
                });
            }
        }
    });

    const { error } = await supabaseClient
        .from("work_schedule")
        .upsert(rows, {
            onConflict: "employee,work_date"
        });

    if (error) {
        throw error;
    }
}

async function loadSchedules() {
    const { data, error } = await supabaseClient
        .from("work_schedule")
        .select("*");

    if (error) throw error;

    if (!data || data.length === 0) {
        copyDefaults();
        await saveAllSchedules();
        return;
    }

    schedules = {};

    employees.forEach(employee => {
        schedules[employee] = {};
    });

    data.forEach(row => {
        if (!schedules[row.employee]) {
            schedules[row.employee] = {};
        }

        schedules[row.employee][fromDbDate(row.work_date)] = {
            type: row.shift_type || "",
            start: row.start_time || "",
            end: row.end_time || "",
            break: row.break_time || ""
        };
    });

    ensureScheduleStructure();
}

async function loadRequests() {
    const { data, error } = await supabaseClient
        .from("shift_requests")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) throw error;

    requests = data || [];
}

async function login() {
    const name = document.getElementById("loginName").value;
    const password = document.getElementById("loginPassword").value;
    const error = document.getElementById("loginError");

    if (!name || users[name] !== password) {
        error.textContent = "Грешно име или парола.";
        return;
    }

    currentUser = name;

    try {
        error.textContent = "Зареждане...";

        await loadSchedules();
        await loadRequests();

        currentPage = currentUser === "Петя" ? "admin" : "my";
        render();

    } catch (e) {
        error.textContent = "Грешка при свързването с базата: " + e.message;
        currentUser = null;
    }
}

function safeId(value) {
    return value
        .replaceAll(" ", "_")
        .replaceAll(".", "_")

}

    if (!schedules[employee]) schedules[employee] = {};

    const preset = shiftTypes[type] || emptyShift();

    schedules[employee][date] = {
        type: type,
        start: preset.start,
        end: preset.end,
        break: preset.break
    };

    const start = document.getElementById(
        `start_${safeId(employee)}_${safeId(date)}`
    );

    const end = document.getElementById(
        `end_${safeId(employee)}_${safeId(date)}`
    );

    const breakInput = document.getElementById(
        `break_${safeId(employee)}_${safeId(date)}`
    );

    if (start) start.value = preset.start;
    if (end) end.value = preset.end;
    if (breakInput) breakInput.value = preset.break;
}

async function saveAdminSchedule() {
    try {
        for (const employee of employees) {
            for (const item of getMonthDates(2026, currentMonth)) {
                const start = document.getElementById(
                    `start_${safeId(employee)}_${safeId(item.date)}`
                );

                const end = document.getElementById(
                    `end_${safeId(employee)}_${safeId(item.date)}`
                );

                const breakInput = document.getElementById(
                    `break_${safeId(employee)}_${safeId(item.date)}`
                );

                const typeSelect = document.getElementById(
                    `type_${safeId(employee)}_${safeId(item.date)}`
                );

                schedules[employee][item.date] = {
                    type: typeSelect?.value || "",
                    start: start?.value || "",
                    end: end?.value || "",
                    break: breakInput?.value || ""
                };
            }
        }

        await saveAllSchedules();

        showStatus("Графикът е запазен успешно.", "ok");

        setTimeout(() => render(), 700);

    } catch (e) {
        showStatus("Грешка при запис: " + e.message, "error");
    }
}

function isWorkShift(shift) {
    if (!shift) return false;

    return shift.type &&
        !["Почивка", "Отпуска", "Самоотлъчка"].includes(shift.type);
}

function openSwap(date) {
    const content = document.getElementById("content");

    const others = employees.filter(e =>
        e !== currentUser &&
        e !== "Петя"
    );

    content.innerHTML = `
        <div class="card">
            <h2>Предложи размяна</h2>

            <p>
                Твоята смяна:
                <strong>${date}</strong>
                —
                ${schedules[currentUser]?.[date]?.type || ""}
                ${schedules[currentUser]?.[date]?.start || ""}
                ${schedules[currentUser]?.[date]?.end
                    ? "– " + schedules[currentUser][date].end
                    : ""}
            </p>

            <label>С кого искаш да размениш?</label>
            <select id="swapReceiver">
                ${others.map(e => `<option value="${e}">${e}</option>`).join("")}
            </select>

            <label>Неговата/нейната дата</label>
            <select id="swapReceiverDate">
                ${getAllDates().map(d => `
                    <option value="${d.date}">${d.date} — ${d.weekday}</option>
                `).join("")}
            </select>

            <label>Съобщение</label>
            <textarea id="swapMessage"
                placeholder="Напиши съобщение към служителя..."></textarea>

```
        <button class="primary" onclick="sendSwap('${date}')">
            Изпрати предложение
        </button>

        <button class="secondary" onclick="render()">
            Отказ
        </button>
    </div>
`;
```

}

function getAllDates() {
const result = [];

```
for (const month of months) {
    result.push(...getMonthDates(month.year, month.month));
}

return result;
```

}

async function sendSwap(myDate) {
const receiver = document.getElementById("swapReceiver").value;
const receiverDate = document.getElementById("swapReceiverDate").value;
const message = document.getElementById("swapMessage").value.trim();

```
if (!receiver || !receiverDate) {
    alert("Избери служител и дата.");
    return;
}

if (receiver === currentUser) {
    alert("Не можеш да изпратиш предложение към себе си.");
    return;
}

if (myDate === receiverDate && receiver === currentUser) {
    alert("Невалидна размяна.");
    return;
}

const { error } = await supabaseClient
    .from("shift_requests")
    .insert({
        proposer: currentUser,
        receiver: receiver,
        proposer_date: toDbDate(myDate),
        receiver_date: toDbDate(receiverDate),
        message: message,
        status: "pending"
    });

if (error) {
    alert("Грешка: " + error.message);
    return;
}

await loadRequests();

alert("Предложението е изпратено. Изчаква се отговор от служителя.");
currentPage = "requests";
renderRequestsPage();
```

}

function renderRequestsPage() {
const content = document.getElementById("content");

```
const received = requests.filter(r => r.receiver === currentUser);
const sent = requests.filter(r => r.proposer === currentUser);

content.innerHTML = `
    <div class="card">
        <h2>Размени на смени</h2>

        <h3>Получени предложения</h3>

        ${received.length
            ? received.map(renderRequest).join("")
            : "<p class='small'>Няма получени предложения.</p>"}

        <hr>

        <h3>Изпратени предложения</h3>

        ${sent.length
            ? sent.map(renderRequest).join("")
            : "<p class='small'>Няма изпратени предложения.</p>"}
    </div>

    ${currentUser === "Петя" ? `
        <div class="card">
            <h2>Одобрение от Петя</h2>
            ${renderAdminRequests()}
        </div>
    ` : ""}
`;
```

}

function renderMyRequestList() {
const mine = requests.filter(r =>
r.proposer === currentUser ||
r.receiver === currentUser
);

```
if (!mine.length) {
    return "<p class='small'>Няма предложения.</p>";
}

return mine.slice(0, 10).map(renderRequest).join("");
```

}

function renderRequest(r) {
const myReceived = r.receiver === currentUser;

```
let statusText = {
    pending: "Чака отговор",
    accepted: "Прието – чака Петя",
    rejected: "Отказано",
    approved: "Одобрено от Петя"
}[r.status] || r.status;

const proposerShift = schedules[r.proposer]?.[fromDbDate(r.proposer_date)];
const receiverShift = schedules[r.receiver]?.[fromDbDate(r.receiver_date)];

return `
    <div class="request ${r.status}">
        <div class="request-title">
            ${r.proposer} → ${r.receiver}
        </div>

        <div>
            <strong>${fromDbDate(r.proposer_date)}</strong>
            —
            ${proposerShift?.type || "няма смена"}
            ↔
            <strong>${fromDbDate(r.receiver_date)}</strong>
            —
            ${receiverShift?.type || "няма смена"}
        </div>

        ${r.message
            ? `<p>💬 ${escapeHtml(r.message)}</p>`
            : ""}

        <span class="badge">${statusText}</span>

        ${myReceived && r.status === "pending" ? `
            <div class="request-buttons">
                <button class="success"
                    onclick="respondRequest(${r.id}, 'accepted')">
                    Приеми
                </button>

                <button class="danger"
                    onclick="respondRequest(${r.id}, 'rejected')">
                    Откажи
                </button>
            </div>
        ` : ""}

        ${currentUser === "Петя" && r.status === "accepted" ? `
            <div class="request-buttons">
                <button class="success"
                    onclick="approveRequest(${r.id})">
                    Одобри размяната
                </button>

                <button class="danger"
                    onclick="adminRejectRequest(${r.id})">
                    Откажи
                </button>
            </div>
        ` : ""}
    </div>
`;
```

}

function renderAdminRequests() {
const waiting = requests.filter(r => r.status === "accepted");

```
if (!waiting.length) {
    return "<p class='small'>Няма размени, чакащи одобрение.</p>";
}

return waiting.map(renderRequest).join("");
```

}

async function respondRequest(id, status) {
const { error } = await supabaseClient
.from("shift_requests")
.update({
status: status,
receiver_response_at: new Date().toISOString()
})
.eq("id", id)
.eq("receiver", currentUser)
.eq("status", "pending");

```
if (error) {
    alert("Грешка: " + error.message);
    return;
}

await loadRequests();
renderRequestsPage();
```

}

async function adminRejectRequest(id) {
const { error } = await supabaseClient
.from("shift_requests")
.update({
status: "rejected",
admin_decision_at: new Date().toISOString()
})
.eq("id", id)
.eq("status", "accepted");

```
if (error) {
    alert("Грешка: " + error.message);
    return;
}

await loadRequests();
renderRequestsPage();
```

}

async function approveRequest(id) {
const request = requests.find(r => r.id === id);

```
if (!request || request.status !== "accepted") {
    alert("Това предложение вече не чака одобрение.");
    return;
}

const proposerDate = fromDbDate(request.proposer_date);
const receiverDate = fromDbDate(request.receiver_date);

const proposerShift = schedules[request.proposer]?.[proposerDate];
const receiverShift = schedules[request.receiver]?.[receiverDate];

if (!proposerShift || !receiverShift) {
    alert("Не могат да се намерят двете смени.");
    return;
}

const proposerCopy = { ...proposerShift };
const receiverCopy = { ...receiverShift };

schedules[request.proposer][proposerDate] = receiverCopy;
schedules[request.receiver][receiverDate] = proposerCopy;

try {
    await saveAllSchedules();

    const { error } = await supabaseClient
        .from("shift_requests")
        .update({
            status: "approved",
            admin_decision_at: new Date().toISOString()
        })
        .eq("id", id)
        .eq("status", "accepted");

    if (error) throw error;

    await loadSchedules();
    await loadRequests();

    alert("Размяната е одобрена и графикът е променен.");

    currentPage = "admin";
    render();

} catch (e) {
    alert("Грешка при одобряване: " + e.message);

    await loadSchedules();
    render();
}
```

}

function escapeHtml(text) {
return String(text)
.replaceAll("&", "&")
.replaceAll("<", "<")
.replaceAll(">", ">")
.replaceAll('"', """)
.replaceAll("'", "'");
}
