<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Работен график</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #d1d5db;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --success: #16a34a;
    --warning: #d97706;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

.login-box h1 {
    margin-top: 0;
    text-align: center;
}

.login-box p {
    text-align: center;
    color: var(--muted);
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: white;
    color: #111827;
}

textarea {
    min-height: 80px;
    resize: vertical;
}

.primary-btn,
.secondary-btn,
.danger-btn,
.success-btn {
    border: 0;
    border-radius: 9px;
    padding: 11px 15px;
    font-weight: bold;
}

.primary-btn {
    background: var(--primary);
    color: white;
}

.primary-btn:hover {
    background: var(--primary-dark);
}

.secondary-btn {
    background: #e5e7eb;
    color: #111827;
}

.danger-btn {
    background: var(--danger);
    color: white;
}

.success-btn {
    background: var(--success);
    color: white;
}

.full {
    width: 100%;
}

.login-error {
    margin-top: 12px;
    color: var(--danger);
    font-weight: bold;
    text-align: center;
}

/* APP */

#appPage {
    min-height: 100vh;
}

.topbar {
    background: #111827;
    color: white;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.topbar-title {
    font-size: 20px;
    font-weight: bold;
}

.topbar-user {
    font-size: 14px;
}

.logout-btn {
    background: #374151;
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 8px 12px;
}

.container {
    max-width: 1500px;
    margin: auto;
    padding: 16px;
}

.tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

.tab-btn {
    border: 0;
    background: #e5e7eb;
    padding: 10px 15px;
    border-radius: 9px;
    font-weight: bold;
}

.tab-btn.active {
    background: var(--primary);
    color: white;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.card h2,
.card h3 {
    margin-top: 0;
}

/* MONTH CONTROLS */

.month-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.month-title {
    font-size: 21px;
    font-weight: bold;
}

.month-buttons {
    display: flex;
    gap: 7px;
}

/* TABLE */

.table-wrapper {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
}

.schedule-table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1000px;
}

.schedule-table th,
.schedule-table td {
    border: 1px solid var(--border);
    padding: 5px;
    text-align: center;
}

.schedule-table th {
    background: #f3f4f6;
    position: sticky;
    top: 0;
    z-index: 3;
}

.employee-cell {
    position: sticky;
    left: 0;
    z-index: 4;
    background: white !important;
    text-align: left !important;
    min-width: 190px;
    font-weight: bold;
}

.day-header {
    min-width: 75px;
}

.weekend {
    background: #fff7ed !important;
}

.today {
    outline: 3px solid #2563eb;
    outline-offset: -3px;
}

.shift-select {
    min-width: 75px;
    padding: 7px 4px;
    font-size: 12px;
}

.save-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 14px;
}

.status {
    margin-top: 10px;
    font-weight: bold;
}

/* ADMIN */

.admin-user {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
}

.admin-user-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr auto auto auto;
    gap: 8px;
    align-items: center;
}

.check-row {
    display: flex;
    gap: 6px;
    align-items: center;
    white-space: nowrap;
}

.check-row input {
    width: auto;
}

/* SWAPS */

.swap-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.swap-request {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
}

.badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.badge-pending {
    background: #fef3c7;
    color: #92400e;
}

.badge-approved {
    background: #dcfce7;
    color: #166534;
}

.badge-rejected {
    background: #fee2e2;
    color: #991b1b;
}

/* SHIFT MANAGEMENT */

.shift-type-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr auto;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
}

.small-note {
    color: var(--muted);
    font-size: 13px;
}

/* MOBILE */

@media (max-width: 700px) {

    .topbar {
        flex-wrap: wrap;
    }

    .topbar-title {
        width: 100%;
    }

    .swap-grid {
        grid-template-columns: 1fr;
    }

    .admin-user-grid {
        grid-template-columns: 1fr;
    }

    .shift-type-row {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 10px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

    <div class="login-box">

        <h1>Работен график</h1>

        <p>Вход в системата</p>

        <div class="form-group">
            <label for="loginName">Служител</label>

            <select id="loginName">
                <option value="">Избери служител</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loginPassword">Парола</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Въведи парола"
            >
        </div>

        <button
            class="primary-btn full"
            onclick="login()"
        >
            Вход
        </button>

        <div id="loginError" class="login-error"></div>

    </div>

</div>


<!-- APP -->

<div id="appPage" class="hidden">

    <div class="topbar">

        <div class="topbar-title">
            Работен график
        </div>

        <div class="topbar-user">
            <span id="currentUserName"></span>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Изход
            </button>
        </div>

    </div>


    <div class="container">

        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab-btn active"
                id="tabMy"
                onclick="showTab('my')"
            >
                Моят график
            </button>

            <button
                class="tab-btn"
                id="tabAll"
                onclick="showTab('all')"
            >
                Общ график
            </button>

            <button
                class="tab-btn"
                id="tabSwap"
                onclick="showTab('swap')"
            >
                Размени
            </button>

            <button
                class="tab-btn hidden"
                id="tabAdmin"
                onclick="showTab('admin')"
            >
                Администрация
            </button>

        </div>


        <!-- MY SCHEDULE -->

        <section id="mySection">

            <div class="card">

                <div class="month-controls">

                    <div class="month-title" id="myMonthTitle"></div>

                    <div class="month-buttons">

                        <button
                            class="secondary-btn"
                            onclick="changeMonth(-1)"
                        >
                            ◀
                        </button>

                        <button
                            class="secondary-btn"
                            onclick="goToday()"
                        >
                            Днес
                        </button>

                        <button
                            class="secondary-btn"
                            onclick="changeMonth(1)"
                        >
                            ▶
                        </button>

                    </div>

                </div>

                <div id="myScheduleContainer"></div>

            </div>

        </section>


        <!-- ALL SCHEDULE -->

        <section id="allSection" class="hidden">

            <div class="card">

                <div class="month-controls">

                    <div class="month-title" id="allMonthTitle"></div>

                    <div class="month-buttons">

                        <button
                            class="secondary-btn"
                            onclick="changeMonth(-1)"
                        >
                            ◀
                        </button>

                        <button
                            class="secondary-btn"
                            onclick="goToday()"
                        >
                            Днес
                        </button>

                        <button
                            class="secondary-btn"
                            onclick="changeMonth(1)"
                        >
                            ▶
                        </button>

                    </div>

                </div>

                <div id="allScheduleContainer"></div>

                <div
                    id="adminScheduleSaveArea"
                    class="save-row hidden"
                >
                    <button
                        class="success-btn"
                        onclick="saveAllSchedule()"
                    >
                        Запази промените
                    </button>
                </div>

                <div
                    id="scheduleStatus"
                    class="status"
                ></div>

            </div>

        </section>


        <!-- SWAPS -->

        <section id="swapSection" class="hidden">

            <div class="card">

                <h2>Заявка за размяна</h2>

                <div class="swap-grid">

                    <div>

                        <div class="form-group">

                            <label>Моята дата</label>

                            <input
                                type="date"
                                id="swapMyDate"
                            >

                        </div>

                        <div class="form-group">

                            <label>Служител</label>

                            <select id="swapReceiver"></select>

                        </div>

                        <div class="form-group">

                            <label>Дата на другия служител</label>

                            <input
                                type="date"
                                id="swapReceiverDate"
                            >

                        </div>

                        <div class="form-group">

                            <label>Съобщение</label>

                            <textarea
                                id="swapMessage"
                                placeholder="Например: Може ли да разменим смените?"
                            ></textarea>

                        </div>

                        <button
                            class="primary-btn"
                            onclick="sendSwapRequest()"
                        >
                            Изпрати заявка
                        </button>

                    </div>

                    <div>

                        <h3>Моите заявки</h3>

                        <div id="mySwapRequests"></div>

                    </div>

                </div>

            </div>


            <div
                id="adminSwapCard"
                class="card hidden"
            >

                <h2>Заявки за размяна</h2>

                <div id="adminSwapRequests"></div>

            </div>

        </section>


        <!-- ADMIN -->

        <section
            id="adminSection"
            class="hidden"
        >

            <div class="card">

                <h2>Добавяне на служител</h2>

                <div class="swap-grid">

                    <div class="form-group">
                        <label>Име</label>
                        <input id="newUserName">
                    </div>

                    <div class="form-group">
                        <label>Парола</label>
                        <input id="newUserPassword">
                    </div>

                </div>

                <div class="check-row">
                    <input
                        type="checkbox"
                        id="newUserAdmin"
                    >
                    <label for="newUserAdmin">Администратор</label>
                </div>

                <br>

                <div class="check-row">
                    <input
                        type="checkbox"
                        id="newUserSeptember"
                    >
                    <label for="newUserSeptember">
                        Само за септември
                    </label>
                </div>

                <br>

                <button
                    class="primary-btn"
                    onclick="addUser()"
                >
                    Добави служител
                </button>

            </div>


            <div class="card">

                <h2>Потребители</h2>

                <div id="adminUsers"></div>

            </div>


            <div class="card">

                <h2>Видове смени</h2>

                <p class="small-note">
                    Почивка се записва като празно поле.
                    „Ц“ е 09:00–21:00.
                </p>

                <div id="shiftTypesAdmin"></div>

                <br>

                <button
                    class="primary-btn"
                    onclick="addShiftType()"
                >
                    Добави смяна
                </button>

            </div>

        </section>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://feahxunujegspmfgicfw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qtFfIY15FcRdBcUzTW56Jg_bGXHiLgR";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let USERS = [];

let currentUser = null;

let currentMonth =
    new Date().getMonth();

let currentYear =
    new Date().getFullYear();

let scheduleData = {};

let editingAllSchedule = false;


/* =========================================================
   DEFAULT SHIFT TYPES
========================================================= */

const DEFAULT_SHIFT_TYPES = [
    {
        code: "",
        name: "Почивка",
        start: "",
        end: "",
        paid: 0
    },
    {
        code: "1",
        name: "1-ва смяна",
        start: "09:00",
        end: "16:00",
        paid: 6
    },
    {
        code: "2",
        name: "2-ра смяна",
        start: "14:00",
        end: "21:00",
        paid: 6
    },
    {
        code: "Р",
        name: "Р",
        start: "09:00",
        end: "18:00",
        paid: 8
    },
    {
        code: "У",
        name: "Управител",
        start: "09:00",
        end: "17:00",
        paid: 7
    },
    {
        code: "Ц",
        name: "Ц",
        start: "09:00",
        end: "21:00",
        paid: 11
    },
    {
        code: "О",
        name: "Отпуска",
        start: "",
        end: "",
        paid: 0
    },
    {
        code: "С",
        name: "Самоотлъчка",
        start: "",
        end: "",
        paid: 0
    },
    {
        code: "ПЕР",
        name: "Персонална",
        start: "",
        end: "",
        paid: 0
    }
];


function getShiftTypes() {

    const saved =
        localStorage.getItem("shiftTypes");

    if (!saved) {

        localStorage.setItem(
            "shiftTypes",
            JSON.stringify(DEFAULT_SHIFT_TYPES)
        );

        return DEFAULT_SHIFT_TYPES;
    }

    try {

        return JSON.parse(saved);

    } catch {

        return DEFAULT_SHIFT_TYPES;
    }
}


function saveShiftTypesLocal(types) {

    localStorage.setItem(
        "shiftTypes",
        JSON.stringify(types)
    );
}


/* =========================================================
   SCHEDULE TIMES FOR DATABASE
   FIX FOR NOT NULL start_time / end_time
========================================================= */

function getScheduleTimes(shiftCode) {

    const type =
        getShiftTypes().find(
            t => t.code === shiftCode
        );

    if (
        type &&
        type.start &&
        type.end
    ) {

        return {

            start_time:
                type.start,

            end_time:
                type.end,

            break_time:
                "60"

        };

    }

    /*
       Supabase work_schedule.start_time
       and end_time are NOT NULL.

       Therefore for:
       - Почивка
       - Отпуска
       - Самоотлъчка
       - Персонална

       we store 00:00 instead of NULL.
    */

    return {

        start_time:
            "00:00",

        end_time:
            "00:00",

        break_time:
            "0"

    };

}


/* =========================================================
   LOAD USERS
========================================================= */

async function loadUsersFromSupabase() {

    console.log("Зареждане на app_users...");

    const {
        data,
        error
    } = await supabaseClient
        .from("app_users")
        .select(
            "id,name,password,admin,active,september_only"
        )
        .order(
            "name",
            {
                ascending: true
            }
        );

    if (error) {

        console.error(
            "SUPABASE APP_USERS ERROR:",
            error
        );

        USERS = [];

        document.getElementById(
            "loginError"
        ).innerHTML =
            "Грешка при зареждане на потребителите.<br><br>" +
            error.message;

        return false;
    }

    console.log(
        "APP_USERS:",
        data
    );

    USERS =
        (data || []).map(user => ({

            id: user.id,

            name: user.name,

            password:
                user.password ?? "",

            admin:
                user.admin === true,

            active:
                user.active !== false,

            septemberOnly:
                user.september_only === true

        }));

    populateLoginUsers();

    return true;
}


/* =========================================================
   LOGIN USERS
========================================================= */

function populateLoginUsers() {

    const select =
        document.getElementById(
            "loginName"
        );

    select.innerHTML =
        '<option value="">Избери служител</option>';

    USERS
        .filter(user => user.active)
        .sort((a,b) =>
            a.name.localeCompare(
                b.name,
                "bg"
            )
        )
        .forEach(user => {

            const option =
                document.createElement("option");

            option.value =
                user.name;

            option.textContent =
                user.name;

            select.appendChild(
                option
            );

        });
}


/* =========================================================
   LOGIN
========================================================= */

async function login() {

    const name =
        document.getElementById(
            "loginName"
        ).value;

    const password =
        document.getElementById(
            "loginPassword"
        ).value;

    const errorBox =
        document.getElementById(
            "loginError"
        );

    errorBox.textContent = "";

    if (!name) {

        errorBox.textContent =
            "Избери служител.";

        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("app_users")
        .select(
            "id,name,password,admin,active,september_only"
        )
        .eq(
            "name",
            name
        )
        .eq(
            "active",
            true
        )
        .maybeSingle();

    if (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );

        errorBox.textContent =
            "Supabase грешка: " +
            error.message;

        return;
    }

    if (!data) {

        errorBox.textContent =
            "Потребителят не е намерен.";

        return;
    }

    if (
        String(data.password ?? "") !==
        String(password)
    ) {

        errorBox.textContent =
            "Грешна парола.";

        return;
    }

    currentUser = {

        id: data.id,

        name: data.name,

        password: data.password,

        admin: data.admin,

        active: data.active,

        septemberOnly:
            data.september_only

    };

    localStorage.setItem(
        "loggedUser",
        currentUser.name
    );

    showApp();

}


/* =========================================================
   SHOW APP
========================================================= */

async function showApp() {

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("appPage")
        .classList.remove("hidden");

    document
        .getElementById("currentUserName")
        .textContent =
            currentUser.name;

    if (currentUser.admin) {

        document
            .getElementById("tabAdmin")
            .classList.remove("hidden");

        document
            .getElementById("adminSwapCard")
            .classList.remove("hidden");

        document
            .getElementById("adminScheduleSaveArea")
            .classList.remove("hidden");

        editingAllSchedule = true;

    } else {

        editingAllSchedule = false;

    }

    await refreshEverything();

    showTab("my");
}


/* =========================================================
   AUTO LOGIN
========================================================= */

async function restoreSession() {

    const savedName =
        localStorage.getItem(
            "loggedUser"
        );

    if (!savedName) {
        return;
    }

    const user =
        USERS.find(
            u =>
                u.name === savedName &&
                u.active
        );

    if (!user) {
        return;
    }

    currentUser = user;

    await showApp();
}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    localStorage.removeItem(
        "loggedUser"
    );

    currentUser = null;

    document
        .getElementById("appPage")
        .classList.add("hidden");

    document
        .getElementById("loginPage")
        .classList.remove("hidden");

    document
        .getElementById("loginPassword")
        .value = "";

    document
        .getElementById("loginName")
        .value = "";

    document
        .getElementById("loginError")
        .textContent = "";

}


/* =========================================================
   TABS
========================================================= */

function showTab(tab) {

    const sections = [
        "mySection",
        "allSection",
        "swapSection",
        "adminSection"
    ];

    sections.forEach(id => {

        document
            .getElementById(id)
            .classList.add("hidden");

    });


    const buttons = [
        "tabMy",
        "tabAll",
        "tabSwap",
        "tabAdmin"
    ];

    buttons.forEach(id => {

        document
            .getElementById(id)
            .classList.remove("active");

    });


    if (tab === "my") {

        document
            .getElementById("mySection")
            .classList.remove("hidden");

        document
            .getElementById("tabMy")
            .classList.add("active");

    }

    if (tab === "all") {

        document
            .getElementById("allSection")
            .classList.remove("hidden");

        document
            .getElementById("tabAll")
            .classList.add("active");

        renderAllSchedule();

    }

            .getElementById("swapSection")
            .classList.remove("hidden");

            .getElementById("tabSwap")
            .classList.add("active");

    }

        if (!currentUser.admin) {
            return;
        }

        document
            .getElementById("adminSection")
            .classList.remove("hidden");

        document
            .getElementById("tabAdmin")
            .classList.add("active");

        renderAdminUsers();

        renderShiftTypesAdmin();

    }
}


/* =========================================================
   MONTH
========================================================= */

function changeMonth(amount) {

    currentMonth += amount;

    if (currentMonth < 0) {

        currentMonth = 11;
        currentYear--;

    }

    if (currentMonth > 11) {

        currentMonth = 0;
        currentYear++;

    }

    refreshScheduleViews();

}


function goToday() {

    const now =
        new Date();

    currentMonth =
        now.getMonth();

    currentYear =
        now.getFullYear();

    refreshScheduleViews();

}


function getDaysInMonth(
    year,
    month
) {

    return new Date(
        year,
        month + 1,
        0
    ).getDate();

}


function formatDate(
    year,
    month,
    day
) {

    return (
        year +
        "-" +
        String(month + 1)
            .padStart(2,"0") +
        "-" +
        String(day)
            .padStart(2,"0")
    );

}


function monthName(
    month
) {

    return [
        "Януари",
        "Февруари",
        "Март",
        "Април",
        "Май",
        "Юни",
        "Юли",
        "Август",
        "Септември",
        "Октомври",
        "Ноември",
        "Декември"
    ][month];

}


function dayName(
    date
) {

    return [
        "Нд",
        "Пн",
        "Вт",
        "Ср",
        "Чт",
        "Пт",
        "Сб"
    ][date.getDay()];

}


/* =========================================================
   SCHEDULE
========================================================= */

async function loadSchedule() {

    const start =
        formatDate(
            currentYear,
            currentMonth,
            1
        );

    const end =
        formatDate(
            currentYear,
            currentMonth,
            getDaysInMonth(
                currentYear,
                currentMonth
            )
        );

    const {
        data,
        error
    } = await supabaseClient
        .from("work_schedule")
        .select("*")
        .gte(
            "work_date",
            start
        )
        .lte(
            "work_date",
            end
        );

    if (error) {

        console.error(
            "SCHEDULE ERROR:",
            error
        );

        alert(
            "Грешка при зареждане на графика:\n" +
            error.message
        );

        return;
    }

    scheduleData = {};

    (data || []).forEach(row => {

        const key =
            row.employee +
            "|" +
            row.work_date;

        scheduleData[key] =
            row.shift_type || "";

    });

}


/* =========================================================
   EMPLOYEE FILTER
========================================================= */

function employeeVisibleInMonth(
    user
) {

    if (!user.active) {
        return false;
    }

    if (
        user.septemberOnly &&
        currentMonth !== 8
    ) {
        return false;
    }

    return true;
}


/* =========================================================
   SHIFT SELECT
========================================================= */

function createShiftSelect(
    employee,
    date,
    disabled = false
) {

    const select =
        document.createElement(
            "select"
        );

    select.className =
        "shift-select";

    const types =
        getShiftTypes();

    const current =
        scheduleData[
            employee +
            "|" +
            date
        ] || "";

    types.forEach(type => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            type.code;

        option.textContent =
            type.code === ""
                ? "П"
                : type.code;

        if (
            type.code === current
        ) {
            option.selected = true;
        }

        select.appendChild(
            option
        );

    });

    select.disabled =
        disabled;

    return select;
}

function renderMySchedule() {

    const container =
        document.getElementById(
            "myScheduleContainer"
        );

    document.getElementById(
        "myMonthTitle"
    ).textContent =
        monthName(currentMonth) +
        " " +
        currentYear;

    if (!currentUser) {
        return;
    }

    const days =
        getDaysInMonth(
            currentYear,
            currentMonth
        );

    let html =
        '<div class="table-wrapper">';

    html +=
        '<table class="schedule-table">';

    html += "<thead><tr>";

    html +=
        '<th class="employee-cell">Дата</th>';

    for (
        let day = 1;
        day <= days;
        day++
    ) {

        const date =
            new Date(
                currentYear,
                currentMonth,
                day
            );

        const today =
            new Date();

        const isToday =
            today.getFullYear() === currentYear &&
            today.getMonth() === currentMonth &&
            today.getDate() === day;

        const weekend =
            date.getDay() === 0 ||
            date.getDay() === 6;

        html +=
            `<th class="day-header ${weekend ? "weekend" : ""} ${isToday ? "today" : ""}">
                ${day}<br>
                <small>${dayName(date)}</small>
            </th>`;

    }

    html += "</tr></thead><tbody><tr>";

    html +=
        `<td class="employee-cell">

        </td>`;

    for (
        let day = 1;
        day <= days;
        day++
    ) {

        const date =
            formatDate(
                currentYear,
                currentMonth,
                day
            );

        const shift =
            scheduleData[
                currentUser.name +
                "|" +
                date
            ] || "";

        html +=
            `<td>${shift || "П"}</td>`;

    }

    html += "</tr></tbody></table></div>";

    container.innerHTML =
        html;

}

    html +=
        '<table class="schedule-table">';

    html += "<thead><tr>";

    html +=
        '<th class="employee-cell">Служител</th>';

    for (
        let day = 1;
        day <= days;
        day++
    ) {

        const date =
            new Date(
                currentYear,
                currentMonth,
                day
            );

        const today =
            new Date();

        const isToday =
            today.getFullYear() === currentYear &&
            today.getMonth() === currentMonth &&
            today.getDate() === day;

        const weekend =
            date.getDay() === 0 ||
            date.getDay() === 6;

        html +=
            `<th class="day-header ${weekend ? "weekend" : ""} ${isToday ? "today" : ""}">

                <small>${dayName(date)}</small>
            </th>`;

        for (

        ) {

            if (

            ) {

                    `<td id="cell-${safeId(user.name)}-${date}"></td>`;

            } else {

                const shift =
                    scheduleData[
                        user.name +

                    ] || "";

            }

    });

    container.innerHTML =
        html;


    /* Put selects into cells */

    if (
        currentUser.admin &&
        editingAllSchedule
    ) {

        users.forEach(user => {

            for (
                let day = 1;
                day <= days;
                day++
            ) {

                const date =
                    formatDate(
                        currentYear,
                        currentMonth,
                        day
                    );

                const cell =
                    document.getElementById(
                        `cell-${safeId(user.name)}-${date}`
                    );

                    continue;
                }

                const select =
                    createShiftSelect(
                        user.name,
                        date,
                        false
                    );

                select.dataset.employee =
                    user.name;

                select.dataset.date =
                    date;

                cell.appendChild(
                    select
                );

            }

        });

    }

function safeId(value) {

    return value
        .replace(
            /[^a-zA-Z0-9А-Яа-я_-]/g,
            "_"
        );

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   SAVE ALL SCHEDULE
========================================================= */

async function saveAllSchedule() {

    if (!currentUser.admin) {
        return;
    }

    const selects =
        document.querySelectorAll(
            "#allScheduleContainer select"
        );

    const rows = [];

    selects.forEach(select => {

        const employee =
            select.dataset.employee;

        const date =
            select.dataset.date;

        const shift =
            select.value;

        const times =
            getScheduleTimes(
                shift
            );

        rows.push({

            employee:
                employee,

            work_date:
                date,

            shift_type:
                shift,

            start_time:
                times.start_time,

            end_time:
                times.end_time,

            break_time:
                times.break_time,

            updated_at:
                new Date().toISOString()

        });

    });


    if (rows.length === 0) {
        return;
    }


    document.getElementById(
        "scheduleStatus"
    ).textContent =
        "Запазване...";


    const {
        error
    } = await supabaseClient
        .from("work_schedule")
        .upsert(
            rows,
            {
                onConflict:
                    "employee,work_date"
            }
        );


    if (error) {

        console.error(
            "SAVE SCHEDULE ERROR:",
            error
        );

        document.getElementById(
            "scheduleStatus"
        ).textContent =
            "Грешка: " +
            error.message;

        return;
    }


    document.getElementById(
        "scheduleStatus"
    ).textContent =
        "✓ Промените са запазени.";

    await loadSchedule();

    renderAllSchedule();

}

        ).value.trim();

        ).checked;

        );

    }


    const {
        error
    } = await supabaseClient
        .from("app_users")
        .update({

            password:

            admin:

            september_only:

            error.message
        );

    await loadUsersFromSupabase();

    const updated =
        USERS.find(

    if (
        updated &&
        updated.id === currentUser.id
    ) {

        currentUser =

            "currentUserName"
        ).textContent =
            currentUser.name;

    }


    renderAdminUsers();

    populateLoginUsers();

    renderAllSchedule();

    updateSwapReceiver();


    alert(

    );

/* =========================================================
   LOAD SWAP REQUESTS
========================================================= */

async function loadSwapRequests() {

    if (!currentUser) {
        return;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("shift_requests")
        .select("*")
        .or(
            `proposer.eq.${escapeFilter(currentUser.name)},receiver.eq.${escapeFilter(currentUser.name)}`
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "SWAP LOAD ERROR:",
            error
        );

        return;
    }


    renderMySwapRequests(
        data || []
    );


    if (currentUser.admin) {

        const result =
            await supabaseClient
                .from("shift_requests")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );

        if (!result.error) {

            renderAdminSwapRequests(
                result.data || []
            );

        }

    }

}


function escapeFilter(

) {

    return String(value)
        .replaceAll(
            ",",
            "\\,"
        );

}

                ${escapeHtml(req.receiver)}
            </strong>

            <br><br>

            ${escapeHtml(req.proposer_date)}
            ↔
            ${escapeHtml(req.receiver_date)}

            <br><br>

            ${escapeHtml(req.message || "")}

            <br><br>

            <span class="badge ${statusClass}">
                ${statusText}
            </span>

            ${
                req.status === "pending"
                    ? `
                        <br><br>

                        <button
                            class="success-btn"
                            onclick="approveSwap('${req.id}')"
                        >
                            Одобри
                        </button>

                        <button
                            class="danger-btn"
                            onclick="rejectSwap('${req.id}')"
                        >
                            Отхвърли
                        </button>
                    `
                    : ""
            }

        `;

        container.appendChild(
            div
        );

    });

}


/* =========================================================
   APPROVE SWAP
   FIXED
========================================================= */

async function approveSwap(
    requestId
) {

    if (!currentUser?.admin) {
        return;
    }


    const {
        data: requests,
        error
    } = await supabaseClient
        .from("shift_requests")
        .select("*")
        .eq(
            "id",
            requestId
        )
        .maybeSingle();


    if (error || !requests) {

        alert(
            "Заявката не е намерена."
        );

        return;
    }


    const request =
        requests;


    const {
        data: rows,
        error: scheduleError
    } = await supabaseClient
        .from("work_schedule")
        .select("*")
        .in(
            "employee",
            [
                request.proposer,
                request.receiver
            ]
        )
        .in(
            "work_date",
            [
                request.proposer_date,
                request.receiver_date
            ]
        );


    if (scheduleError) {

        alert(
            scheduleError.message
        );

        return;
    }


    function findRow(
        employee,
        date
    ) {

        return (
            rows || []
        ).find(
            r =>
                r.employee === employee &&
                r.work_date === date
        );

    }


    const proposerRow =
        findRow(
            request.proposer,
            request.proposer_date
        );

    const receiverRow =
        findRow(
            request.receiver,
            request.receiver_date
        );


    /*
       Ако няма запис за даден служител/дата,
       приемаме, че е почивка.
    */

    const proposerShift =
        proposerRow?.shift_type || "";

    const receiverShift =
        receiverRow?.shift_type || "";


    /*
       ВАЖНО:
       Не изпращаме NULL към start_time/end_time.
    */

    const proposerTimes =
        getScheduleTimes(
            proposerShift
        );

    const receiverTimes =
        getScheduleTimes(
            receiverShift
        );


    const now =
        new Date().toISOString();


    /*
       Разменяме самите смени:

       proposer получава receiverShift
       receiver получава proposerShift
    */

    const updates = [

        {
            employee:
                request.proposer,

            work_date:
                request.proposer_date,

            shift_type:
                receiverShift,

            start_time:
                receiverTimes.start_time,

            end_time:
                receiverTimes.end_time,

            break_time:
                receiverTimes.break_time,

            updated_at:
                now

        },

        {
            employee:
                request.receiver,

            work_date:
                request.receiver_date,

            shift_type:
                proposerShift,

            start_time:
                proposerTimes.start_time,

            end_time:
                proposerTimes.end_time,

            break_time:
                proposerTimes.break_time,

            updated_at:
                now

        }

    ];


    console.log(
        "SWAP UPDATES:",
        updates
    );


    const {
        error: updateError
    } = await supabaseClient
        .from("work_schedule")
        .upsert(
            updates,
            {
                onConflict:
                    "employee,work_date"
            }
        );


    if (updateError) {

        console.error(
            "SWAP UPDATE ERROR:",
            updateError
        );

        alert(
            "Грешка при размяната:\n" +
            updateError.message
        );

        return;
    }


    const {
        error: requestError
    } = await supabaseClient
        .from("shift_requests")
        .update({

            status:
                "approved",

            admin_decision_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            requestId
        );


    if (requestError) {

        alert(
            requestError.message
        );

        return;
    }


    await loadSchedule();

    renderAllSchedule();

    await loadSwapRequests();


    alert(
        "Размяната е одобрена."
    );

}


/* =========================================================
   REJECT SWAP
========================================================= */

async function rejectSwap(
    requestId
) {

    if (!currentUser?.admin) {
        return;
    }


    const {
        error
    } = await supabaseClient
        .from("shift_requests")
        .update({

            status:
                "rejected",

            admin_decision_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            requestId
        );


    if (error) {

        alert(
            error.message
        );

        return;
    }


    await loadSwapRequests();

}
