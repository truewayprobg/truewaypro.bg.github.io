<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Работен график</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #d1d5db;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --success: #16a34a;
    --warning: #d97706;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

.login-box h1 {
    margin-top: 0;
    text-align: center;
}

.login-box p {
    text-align: center;
    color: var(--muted);
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: white;
    color: #111827;
}

textarea {
    min-height: 80px;
    resize: vertical;
}

.primary-btn,
.secondary-btn,
.danger-btn,
.success-btn {
    border: 0;
    border-radius: 9px;
    padding: 11px 15px;
    font-weight: bold;
}

.primary-btn {
    background: var(--primary);
    color: white;
}

.primary-btn:hover {
    background: var(--primary-dark);
}

.secondary-btn {
    background: #e5e7eb;
    color: #111827;
}

.danger-btn {
    background: var(--danger);
    color: white;
}

.success-btn {
    background: var(--success);
    color: white;
}

.full {
    width: 100%;
}

.login-error {
    margin-top: 12px;
    color: var(--danger);
    font-weight: bold;
    text-align: center;
}

/* APP */

#appPage {
    min-height: 100vh;
}

.topbar {
    background: #111827;
    color: white;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.topbar-title {
    font-size: 20px;
    font-weight: bold;
}

.topbar-user {
    font-size: 14px;
}

.logout-btn {
    background: #374151;
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 8px 12px;
}

.container {
    max-width: 1500px;
    margin: auto;
    padding: 16px;
}

.tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

.tab-btn {
    border: 0;
    background: #e5e7eb;
    padding: 10px 15px;
    border-radius: 9px;
    font-weight: bold;
}

.tab-btn.active {
    background: var(--primary);
    color: white;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.card h2,
.card h3 {
    margin-top: 0;
}

/* MONTH CONTROLS */

.month-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.month-title {
    font-size: 21px;
    font-weight: bold;
}

.month-buttons {
    display: flex;
    gap: 7px;
}

/* TABLE */

.table-wrapper {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
}

.schedule-table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1000px;
}

.schedule-table th,
.schedule-table td {
    border: 1px solid var(--border);
    padding: 5px;
    text-align: center;
}

.schedule-table th {
    background: #f3f4f6;
    position: sticky;
    top: 0;
    z-index: 3;
}

.employee-cell {
    position: sticky;
    left: 0;
    z-index: 4;
    background: white !important;
    text-align: left !important;
    min-width: 190px;
    font-weight: bold;
}

.day-header {
    min-width: 75px;
}

.weekend {
    background: #fff7ed !important;
}

.today {
    outline: 3px solid #2563eb;
    outline-offset: -3px;
}

.shift-select {
    min-width: 75px;
    padding: 7px 4px;
    font-size: 12px;
}

.save-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 14px;
}

.status {
    margin-top: 10px;
    font-weight: bold;
}

/* ADMIN */

.admin-user {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
}

.admin-user-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr auto auto auto;
    gap: 8px;
    align-items: center;
}

.check-row {
    display: flex;
    gap: 6px;
    align-items: center;
    white-space: nowrap;
}

.check-row input {
    width: auto;
}

/* SWAPS */

.swap-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.swap-request {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
}

.badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.badge-pending {
    background: #fef3c7;
    color: #92400e;
}

.badge-approved {
    background: #dcfce7;
    color: #166534;
}

.badge-rejected {
    background: #fee2e2;
    color: #991b1b;
}

/* SHIFT MANAGEMENT */

.shift-type-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr auto;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
}

.small-note {
    color: var(--muted);
    font-size: 13px;
}

/* MOBILE */

@media (max-width: 700px) {

    .topbar {
        flex-wrap: wrap;
    }

    .topbar-title {
        width: 100%;
    }

    .swap-grid {
        grid-template-columns: 1fr;
    }

    .admin-user-grid {
        grid-template-columns: 1fr;
    }

    .shift-type-row {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 10px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

    <div class="login-box">

        <h1>Работен график</h1>

        <p>Вход в системата</p>

        <div class="form-group">
            <label for="loginName">Служител</label>

            <select id="loginName">
                <option value="">Избери служител</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loginPassword">Парола</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Въведи парола"
            >
        </div>

        <button
            class="primary-btn full"
            onclick="login()"
        >
            Вход
        </button>

        <div id="loginError" class="login-error"></div>

    </div>

</div>


<!-- APP -->

<div id="appPage" class="hidden">

    <div class="topbar">

        <div class="topbar-title">
            Работен график
        </div>

        <div class="topbar-user">
            <span id="currentUserName"></span>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Изход
            </button>
        </div>

    </div>


    <div class="container">

        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab-btn active"
                id="tabMy"
                onclick="showTab('my')"
            >
                Моят график
            </button>

            <button
                class="tab-btn"
                id="tabAll"
                onclick="showTab('all')"
            >
                Общ график
            </button>

            <button
                class="tab-btn"
                id="tabSwap"
                onclick="showTab('swap')"
            >
                Размени
            </button>

            <button
                class="tab-btn hidden"
                id="tabAdmin"
                onclick="showTab('admin')"
            >
                Администрация
            </button>

        </div>


        <!-- MY SCHEDULE -->

        <section id="mySection">

            <div class="card">

                <div class="month-controls">

                    <div class="month-title" id="myMonthTitle"></div>

                    <div class="month-buttons">

                        <button
                            class="secondary-btn"
                            onclick="changeMonth(-1)"
                        >
                            ◀
                        </button>

                        <button
                            class="secondary-btn"
                            onclick="goToday()"
                        >
                            Днес
                        </button>

                        <button
                            class="secondary-btn"
                            onclick="changeMonth(1)"
                        >
                            ▶
                        </button>

                    </div>

                </div>

                <div id="myScheduleContainer"></div>

            </div>

        </section>


        <!-- ALL SCHEDULE -->

        <section id="allSection" class="hidden">

            <div class="card">

                <div class="month-controls">

                    <div class="month-title" id="allMonthTitle"></div>

                    <div class="month-buttons">

                        <button
                            class="secondary-btn"
                            onclick="changeMonth(-1)"
                        >
                            ◀
                        </button>

                        <button
                            class="secondary-btn"
                            onclick="goToday()"
                        >
                            Днес
                        </button>

                        <button
                            class="secondary-btn"
                            onclick="changeMonth(1)"
                        >
                            ▶
                        </button>

                    </div>

                </div>

                <div id="allScheduleContainer"></div>

                <div
                    id="adminScheduleSaveArea"
                    class="save-row hidden"
                >
                    <button
                        class="success-btn"
                        onclick="saveAllSchedule()"
                    >
                        Запази промените
                    </button>
                </div>

                <div
                    id="scheduleStatus"
                    class="status"
                ></div>

            </div>

        </section>


        <!-- SWAPS -->

        <section id="swapSection" class="hidden">

            <div class="card">

                <h2>Заявка за размяна</h2>

                <div class="swap-grid">

                    <div>

                        <div class="form-group">

                            <label>Моята дата</label>

                            <input
                                type="date"
                                id="swapMyDate"
                            >

                        </div>

                        <div class="form-group">

                            <label>Служител</label>

                            <select id="swapReceiver"></select>

                        </div>

                        <div class="form-group">

                            <label>Дата на другия служител</label>

                            <input
                                type="date"
                                id="swapReceiverDate"
                            >

                        </div>

                        <div class="form-group">

                            <label>Съобщение</label>

                            <textarea
                                id="swapMessage"
                                placeholder="Например: Може ли да разменим смените?"
                            ></textarea>

                        </div>

                        <button
                            class="primary-btn"
                            onclick="sendSwapRequest()"
                        >
                            Изпрати заявка
                        </button>

                    </div>

                    <div>

                        <h3>Моите заявки</h3>

                        <div id="mySwapRequests"></div>

                    </div>

                </div>

            </div>


            <div
                id="adminSwapCard"
                class="card hidden"
            >

                <h2>Заявки за размяна</h2>

                <div id="adminSwapRequests"></div>

            </div>

        </section>


        <!-- ADMIN -->

        <section
            id="adminSection"
            class="hidden"
        >

            <div class="card">

                <h2>Добавяне на служител</h2>

                <div class="swap-grid">

                    <div class="form-group">
                        <label>Име</label>
                        <input id="newUserName">
                    </div>

                    <div class="form-group">
                        <label>Парола</label>
                        <input id="newUserPassword">
                    </div>

                </div>

                <div class="check-row">
                    <input
                        type="checkbox"
                        id="newUserAdmin"
                    >
                    <label for="newUserAdmin">Администратор</label>
                </div>

                <br>

                <div class="check-row">
                    <input
                        type="checkbox"
                        id="newUserSeptember"
                    >
                    <label for="newUserSeptember">
                        Само за септември
                    </label>
                </div>

                <br>

                <button
                    class="primary-btn"
                    onclick="addUser()"
                >
                    Добави служител
                </button>

            </div>


            <div class="card">

                <h2>Потребители</h2>

                <div id="adminUsers"></div>

            </div>


            <div class="card">

                <h2>Видове смени</h2>

                <p class="small-note">
                    Почивка се записва като празно поле.
                    „Ц“ е 09:00–21:00 и се брои за 11 работни часа.
                </p>

                <div id="shiftTypesAdmin"></div>

                <br>

                <button
                    class="primary-btn"
                    onclick="addShiftType()"
                >
                    Добави смяна
                </button>

            </div>

        </section>

    </div>

</div>

function getShiftTypes() {

    const saved =
        localStorage.getItem("shiftTypes");

    if (!saved) {

        localStorage.setItem(
            "shiftTypes",
            JSON.stringify(DEFAULT_SHIFT_TYPES)
        );

        return DEFAULT_SHIFT_TYPES;
    }

    try {

        return JSON.parse(saved);

    } catch {

        return DEFAULT_SHIFT_TYPES;
    }
}


function saveShiftTypesLocal(types) {

    localStorage.setItem(
        "shiftTypes",
        JSON.stringify(types)
    );
}


/* =========================================================
   LOAD USERS
========================================================= */

async function loadUsersFromSupabase() {

    console.log("Зареждане на app_users...");

    const {
        data,
        error
    } = await supabaseClient
        .from("app_users")
        .select(
            "id,name,password,admin,active,september_only"
        )
        .order(
            "name",
            {
                ascending: true
            }
        );

    if (error) {

        console.error(
            "SUPABASE APP_USERS ERROR:",
            error
        );

        USERS = [];

        document.getElementById(
            "loginError"
        ).innerHTML =
            "Грешка при зареждане на потребителите.<br><br>" +
            error.message;

        return false;
    }

    console.log(
        "APP_USERS:",
        data
    );

    USERS =
        (data || []).map(user => ({

            id: user.id,

            name: user.name,

            password:
                user.password ?? "",

            admin:
                user.admin === true,

            active:
                user.active !== false,

            septemberOnly:
                user.september_only === true

        }));

    populateLoginUsers();

    return true;
}


/* =========================================================
   LOGIN USERS
========================================================= */

function populateLoginUsers() {

    const select =
        document.getElementById(
            "loginName"
        );

    select.innerHTML =
        '<option value="">Избери служител</option>';

    USERS
        .filter(user => user.active)
        .sort((a,b) =>
            a.name.localeCompare(
                b.name,
                "bg"
            )
        )
        .forEach(user => {

            const option =
                document.createElement("option");

            option.value =
                user.name;

            option.textContent =
                user.name;

            select.appendChild(
                option
            );

        });
}
