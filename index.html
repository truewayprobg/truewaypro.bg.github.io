function pad(n){
    return String(n).padStart(2,"0");
}

function dateToKey(date){
    return date.getFullYear()+"-"+pad(date.getMonth()+1)+"-"+pad(date.getDate());
}

function keyToDate(key){
    const parts = key.split("-");
    return new Date(
        Number(parts[0]),
        Number(parts[1])-1,
        Number(parts[2])
    );
}

function getMonthDates(monthKey){
    const [year,month] = monthKey.split("-").map(Number);

    const first = new Date(year,month-1,1);
    const last = new Date(year,month,0);

    const result = [];

    for(let d=first.getDate(); d<=last.getDate(); d++){
        result.push(
            year+"-"+pad(month)+"-"+pad(d)
        );
    }

    return result;
}

function formatDate(dateKey){
    const d = keyToDate(dateKey);

    const weekdays = [
        "Неделя",
        "Понеделник",
        "Вторник",
        "Сряда",
        "Четвъртък",
        "Петък",
        "Събота"
    ];

    return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()
        +" ("+weekdays[d.getDay()]+")";
}

function ensureSchedule(employee,date){
    if(!schedules[employee]){

            start_time:"",
            end_time:"",
            break_time:""

    }

    return schedules[employee][date];
}

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

async function saveSchedule(employee,date){

    const shift = ensureSchedule(employee,date);

    const {error} = await supabaseClient
        .from("work_schedule")
        .upsert({
            employee:employee,
            work_date:date,
            shift_type:shift.shift_type || "",
            start_time:shift.start_time || "",
            end_time:shift.end_time || "",
            break_time:shift.break_time || ""
        },{
            onConflict:"employee,work_date"
        });

    if(error){
        throw error;
    }
}

async function login(){

    const name = document.getElementById("loginName").value.trim();
    const password = document.getElementById("loginPassword").value;

    const errorBox = document.getElementById("loginError");

    errorBox.textContent = "";

    const user = users.find(
        u => u.name === name && u.password === password
    );

    if(!user){
        errorBox.textContent = "Грешно име или парола.";
        return;
    }

    try{

        await loadSchedules();
        await loadRequests();

        currentUser = user;

        document.getElementById("loginScreen")
            .classList.add("hidden");

        document.getElementById("app")
            .classList.remove("hidden");

        document.getElementById("currentUser")
            .textContent = user.name;

        if(user.admin){
            document.getElementById("btnAdmin")
                .classList.remove("hidden");

            currentPage = "admin";
        }else{
            currentPage = "my";
        }

        render();

    }catch(error){

        console.error(error);

        errorBox.textContent =
            "Грешка при свързване с базата: " +
            (error.message || error);
    }
}

function logout(){

    currentUser = null;

    document.getElementById("app")
        .classList.add("hidden");

    document.getElementById("loginScreen")
        .classList.remove("hidden");

    document.getElementById("loginPassword").value = "";
}

    document.querySelectorAll(".menu button")
        .forEach(b=>b.classList.remove("active"));

    if(currentPage==="my"){

    if(currentPage==="requests"){

        return;
    }

    if(currentPage==="admin"){

        return;
    }
}

                Промените се записват в общата база.
            </p>

            <div class="table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Служител</th>

                            ${dates.map(date=>`
                                <th>
                                    ${pad(keyToDate(date).getDate())}.
                                    ${pad(keyToDate(date).getMonth()+1)}
                                </th>
                            `).join("")}
                        </tr>
                    </thead>

                    <tbody>

                    ${employees.map(employee=>`

                        <tr>
                            <th>${escapeHtml(employee)}</th>

                            ${dates.map(date=>{

                                const s = ensureSchedule(
                                    employee,
                                    date
                                );

                                return `
                                    <td>
                                        <select
                                            onchange="changeShift(
                                                '${employee}',
                                                '${date}',
                                                this.value
                                            )">

                                            ${Object.entries(shiftTypes)
                                                .map(([value,label])=>`
                                                    <option
                                                        value="${escapeHtml(value)}"
                                                        ${s.shift_type===value ? "selected" : ""}>
                                                        ${escapeHtml(label)}
                                                    </option>
                                                `).join("")}

                                        </select>

                                        <input
                                            type="time"
                                            value="${escapeHtml(s.start_time)}"
                                            onchange="changeTime(
                                                '${employee}',
                                                '${date}',
                                                'start_time',
                                                this.value
                                            )">

                                        <input
                                            type="time"
                                            value="${escapeHtml(s.end_time)}"
                                            onchange="changeTime(
                                                '${employee}',
                                                '${date}',
                                                'end_time',
                                                this.value
                                            )">

                                        <input
                                            type="number"
                                            min="0"
                                            placeholder="мин."
                                            value="${escapeHtml(s.break_time)}"
                                            onchange="changeTime(
                                                '${employee}',
                                                '${date}',
                                                'break_time',
                                                this.value
                                            )">
                                    </td>
                                `;

                            }).join("")}

                        </tr>

                    `).join("")}

                    </tbody>
                </table>
            </div>
        </div>
    `;
}


/* =========================
   ADMIN CHANGES
========================= */

async function changeShift(employee,date,value){

    const s = ensureSchedule(employee,date);

    s.shift_type = value;

    if(defaultTimes[value]){
        s.start_time = defaultTimes[value][0];
        s.end_time = defaultTimes[value][1];
    }

    if(value === ""){
        s.start_time = "";
        s.end_time = "";
        s.break_time = "";
    }

    try{

        await saveSchedule(employee,date);

        render();

    }catch(error){

        alert(
            "Грешка при записване: " +
            (error.message || error)
        );
    }
}

async function changeTime(employee,date,field,value){

    const s = ensureSchedule(employee,date);

    s[field] = value;

    try{

        await saveSchedule(employee,date);

    }catch(error){

        alert(
            "Грешка при записване: " +
            (error.message || error)
        );
    }
}


/* =========================
   SHIFT REQUESTS
========================= */

function renderRequests(){

    const visibleRequests = currentUser.admin
        ? requests
        : requests.filter(r =>
            r.proposer === currentUser.name ||
            r.receiver === currentUser.name
        );

    return `
        <div class="card">
            <h2>Размяна на смени</h2>

            <p>
                Можеш да предложиш размяна на твоя смяна
                с друга смяна на колега.
            </p>

            <div class="form-grid">

                <div>
                    <label>Твоя дата</label>
                    <input id="swapMyDate" type="date"
                           min="2026-09-01"
                           max="2026-12-31">
                </div>

                <div>
                    <label>Колега</label>

                    <select id="swapReceiver">
                        ${employees
                            .filter(e=>e!==currentUser.name)
                            .map(e=>`
                                <option value="${escapeHtml(e)}">
                                    ${escapeHtml(e)}
                                </option>
                            `).join("")}
                    </select>
                </div>

                <div>
                    <label>Дата на колегата</label>
                    <input id="swapReceiverDate"
                           type="date"
                           min="2026-09-01"
                           max="2026-12-31">
                </div>

                <div style="grid-column:1/-1">
                    <label>Съобщение</label>
                    <input id="swapMessage"
                           type="text"
                           placeholder="Например: Може ли да си разменим смените?">
                </div>

            </div>

            <br>

            <button class="primary" onclick="createRequest()">
                Предложи размяна
            </button>
        </div>

        <div class="card">
            <h2>Заявки</h2>

            ${
                visibleRequests.length === 0
                ?
                "<p>Няма заявки.</p>"
                :
                visibleRequests.map(renderRequest).join("")
            }
        </div>
    `;
}

function renderRequest(r){

    let statusText = r.status;

    if(r.status==="pending"){
        statusText = "Очаква отговор от колегата";
    }

    if(r.status==="accepted"){
        statusText = "Колегата е приел – очаква одобрение от Петя";
    }

    if(r.status==="rejected"){
        statusText = "Отхвърлена";
    }

    if(r.status==="approved"){
        statusText = "Одобрена – смените са разменени";
    }

    if(r.status==="admin_rejected"){
        statusText = "Отхвърлена от Петя";
    }

    let buttons = "";

    if(
        r.receiver === currentUser.name &&
        r.status === "pending"
    ){
        buttons = `
            <button class="success"
                    onclick="respondRequest(${r.id},'accepted')">
                Приеми
            </button>

            <button class="danger"
                    onclick="respondRequest(${r.id},'rejected')">
                Откажи
            </button>
        `;
    }

    if(
        currentUser.admin &&
        r.status === "accepted"
    ){
        buttons = `
            <button class="success"
                    onclick="adminRequest(${r.id},'approved')">
                Одобри размяната
            </button>

            <button class="danger"
                    onclick="adminRequest(${r.id},'admin_rejected')">
                Откажи
            </button>
        `;
    }

    return `
        <div class="request ${escapeHtml(r.status)}">

            <b>${escapeHtml(r.proposer)}</b>
            предлага размяна с
            <b>${escapeHtml(r.receiver)}</b>

            <p>
                ${formatDate(r.proposer_date)}
                ↔
                ${formatDate(r.receiver_date)}
            </p>

            ${
                r.message
                ?
                `<p>„${escapeHtml(r.message)}“</p>`
                :
                ""
            }

            <div class="status">
                Статус: <b>${escapeHtml(statusText)}</b>
            </div>

            ${buttons}

        </div>
    `;
}


/* =========================
   CREATE REQUEST
========================= */

async function createRequest(){

    const myDate =
        document.getElementById("swapMyDate").value;

    const receiver =
        document.getElementById("swapReceiver").value;

    const receiverDate =
        document.getElementById("swapReceiverDate").value;

    const message =
        document.getElementById("swapMessage").value.trim();

    if(!myDate || !receiverDate){
        alert("Избери и двете дати.");
        return;
    }

    if(receiver === currentUser.name){
        alert("Не можеш да правиш размяна със себе си.");
        return;
    }

    const myShift = ensureSchedule(
        currentUser.name,
        myDate
    );

    const receiverShift = ensureSchedule(
        receiver,
        receiverDate
    );

    if(!myShift.shift_type && !myShift.start_time){
        alert("На избраната твоя дата няма работна смяна.");
        return;
    }

    if(!receiverShift.shift_type && !receiverShift.start_time){
        alert("На избраната дата колегата няма работна смяна.");
        return;
    }

    const {error} = await supabaseClient
        .from("shift_requests")
        .insert({
            proposer:currentUser.name,
            receiver:receiver,
            proposer_date:myDate,
            receiver_date:receiverDate,
            message:message,
            status:"pending"
        });

    if(error){
        alert(
            "Грешка при създаване на заявката: " +
            error.message
        );
        return;
    }

    await loadRequests();
    render();

    alert("Заявката е изпратена.");
}


/* =========================
   RECEIVER RESPONSE
========================= */

async function respondRequest(id,status){

    const {error} = await supabaseClient
        .from("shift_requests")
        .update({
            status:status,
            receiver_response_at:new Date().toISOString()
        })
        .eq("id",id);

    if(error){
        alert(
            "Грешка: " +
            error.message
        );
        return;
    }

    await loadRequests();
    render();
}


/* =========================
   ADMIN APPROVAL
========================= */

async function adminRequest(id,status){

    const request = requests.find(r=>r.id===id);

    if(!request){
        return;
    }

    if(status === "approved"){

        const proposerShift = ensureSchedule(
            request.proposer,
            request.proposer_date
        );

        const receiverShift = ensureSchedule(
            request.receiver,
            request.receiver_date
        );

        /*
           Копираме смените, за да не се
           получи референция към един и същ обект.
        */

        const temp = {
            shift_type:proposerShift.shift_type,
            start_time:proposerShift.start_time,
            end_time:proposerShift.end_time,
            break_time:proposerShift.break_time
        };

        schedules[request.proposer][request.proposer_date] = {
            shift_type:receiverShift.shift_type,
            start_time:receiverShift.start_time,
            end_time:receiverShift.end_time,
            break_time:receiverShift.break_time
        };

        schedules[request.receiver][request.receiver_date] = temp;

        try{

            await saveSchedule(
                request.proposer,
                request.proposer_date
            );

            await saveSchedule(
                request.receiver,
                request.receiver_date
            );

        }catch(error){

            alert(
                "Грешка при размяната: " +
                error.message
            );

            await loadSchedules();
            return;
        }
    }

    const {error} = await supabaseClient
        .from("shift_requests")
        .update({
            status:status,
            admin_decision_at:new Date().toISOString()
        })
        .eq("id",id);

    if(error){
        alert(
            "Грешка: " +
            error.message
        );
        return;
    }

    await loadRequests();
    render();

    if(status==="approved"){
        alert("Размяната е одобрена и смените са разменени.");
    }
}
