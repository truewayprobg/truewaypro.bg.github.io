<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Работен график</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #202124;
    --muted: #6b7280;
    --border: #dfe3e8;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --success: #16a34a;
    --warning: #d97706;
    --input: #ffffff;
}

body.dark {
    --bg: #111827;
    --card: #1f2937;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --border: #374151;
    --primary: #3b82f6;
    --primary-dark: #2563eb;
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
    --input: #111827;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================================================
   LOGIN
   ========================================================= */

#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.login-box h1 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--input);
    color: var(--text);
}

.login-button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    font-weight: bold;
    margin-top: 5px;
}

.login-button:hover {
    background: var(--primary-dark);
}

.login-error {
    color: var(--danger);
    text-align: center;
    margin-top: 12px;
}

/* =========================================================
   APP
   ========================================================= */

#app {
    min-height: 100vh;
}

header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    max-width: 1500px;
    margin: auto;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.user-info {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.small-button {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 8px 11px;
    border-radius: 9px;
}

.small-button:hover {
    background: var(--bg);
}

.tabs {
    max-width: 1500px;
    margin: auto;
    padding: 10px 18px 0;
    display: flex;
    gap: 7px;
    overflow-x: auto;
}

.tab {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px 10px 0 0;
    white-space: nowrap;
}

.tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

main {
    max-width: 1500px;
    margin: auto;
    padding: 20px 18px 50px;
}

.panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 20px;
}

.panel h2,
.panel h3 {
    margin-top: 0;
}

.month-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}

.month-controls button {
    padding: 9px 13px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 9px;
}

.month-title {
    min-width: 180px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

/* =========================================================
   SCHEDULE TABLE
   ========================================================= */

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

.schedule-table {
    border-collapse: collapse;
    width: max-content;
    min-width: 100%;
}

.schedule-table th,
.schedule-table td {
    border: 1px solid var(--border);
    text-align: center;
}

.schedule-table th {
    background: var(--bg);
    padding: 9px 7px;
    font-size: 12px;
    position: sticky;
    top: 0;
    z-index: 5;
}

.schedule-table th.employee-header {
    position: sticky;
    left: 0;
    z-index: 10;
    min-width: 190px;
}

.employee-name {
    position: sticky;
    left: 0;
    z-index: 4;
    background: var(--card);
    text-align: left !important;
    padding: 9px 10px;
    font-weight: bold;
    min-width: 190px;
}

.day-cell {
    min-width: 75px;
    height: 70px;
    vertical-align: top;
    position: relative;
}

.day-cell.weekend {
    background: rgba(255, 180, 0, .08);
}

.day-number {
    font-size: 11px;
    color: var(--muted);
    padding: 3px;
}

.shift-text {
    font-size: 13px;
    font-weight: bold;
    padding: 5px 2px;
}

.shift-time {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
}

.shift-select {
    width: 100%;
    min-width: 70px;
    border: 0;
    background: transparent;
    color: var(--text);
    padding: 5px 2px;
    font-weight: bold;
    text-align: center;
}

.shift-select:focus {
    outline: 2px solid var(--primary);
    border-radius: 5px;
}

.shift-select option {
    background: var(--card);
    color: var(--text);
}

/* =========================================================
   BUTTONS
   ========================================================= */

.primary-button {
    border: 0;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    padding: 11px 15px;
    font-weight: bold;
}

.primary-button:hover {
    background: var(--primary-dark);
}

.success-button {
    border: 0;
    border-radius: 10px;
    background: var(--success);
    color: white;
    padding: 10px 14px;
}

.danger-button {
    border: 0;
    border-radius: 10px;
    background: var(--danger);
    color: white;
    padding: 10px 14px;
}

.warning-button {
    border: 0;
    border-radius: 10px;
    background: var(--warning);
    color: white;
    padding: 10px 14px;
}

/* =========================================================
   ADMIN
   ========================================================= */

.admin-user {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
}

.admin-user-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr auto auto auto;
    gap: 10px;
    align-items: center;
}

.admin-user input {
    width: 100%;
    padding: 9px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--input);
    color: var(--text);
}

.checkbox-row {
    display: flex;
    gap: 8px;
    align-items: center;
    white-space: nowrap;
}

/* =========================================================
   SWAPS
   ========================================================= */

.swap-form {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.swap-form .full {
    grid-column: 1 / -1;
}

.swap-request {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
}

.status {
    display: inline-block;
    border-radius: 20px;
    padding: 4px 9px;
    font-size: 12px;
    font-weight: bold;
}

.status.pending {
    background: #fef3c7;
    color: #92400e;
}

.status.accepted {
    background: #dcfce7;
    color: #166534;
}

.status.rejected {
    background: #fee2e2;
    color: #991b1b;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 800px) {
    .header-inner {
        align-items: flex-start;
        flex-direction: column;
    }

    .user-info {
        justify-content: flex-start;
    }

    .admin-user-grid {
        grid-template-columns: 1fr;
    }

    .swap-form {
        grid-template-columns: 1fr;
    }

    .swap-form .full {
        grid-column: auto;
    }

    main {
        padding: 12px 8px 40px;
    }

    .panel {
        padding: 12px;
    }
}

.loading {
    text-align: center;
    padding: 30px;
    color: var(--muted);
}
</style>
</head>

<body>

<!-- =========================================================
     LOGIN
     ========================================================= -->

<div id="loginScreen">

    <div class="login-box">

        <h1>📅 Работен график</h1>

        <div class="form-group">
            <label for="loginName">Име</label>

            <select id="loginName">
                <option value="">Избери потребител</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loginPassword">Парола</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Въведи парола"
            >
        </div>

        <button
            class="login-button"
            onclick="login()"
        >
            Вход
        </button>

        <div
            id="loginError"
            class="login-error hidden"
        ></div>

    </div>

</div>


<!-- =========================================================
     APP
     ========================================================= -->

<div id="app" class="hidden">

<header>

    <div class="header-inner">

        <div class="logo">
            📅 Работен график
        </div>

        <div class="user-info">

            <strong id="currentUserName"></strong>

            <button
                class="small-button"
                onclick="toggleTheme()"
            >
                🌙 / ☀️
            </button>

            <button
                class="small-button"
                onclick="logout()"
            >
                Изход
            </button>

        </div>

    </div>


    <div class="tabs">

        <button
            class="tab active"
            data-tab="mySchedule"
            onclick="openTab('mySchedule')"
        >
            Моят график
        </button>

        <button
            class="tab"
            data-tab="allSchedule"
            onclick="openTab('allSchedule')"
        >
            Общ график
        </button>

        <button
            class="tab"
            data-tab="swaps"
            onclick="openTab('swaps')"
        >
            Размени
        </button>

        <button
            id="adminTab"
            class="tab hidden"
            data-tab="admin"
            onclick="openTab('admin')"
        >
            Администрация
        </button>

    </div>

</header>


<main>

<!-- =========================================================
     MY SCHEDULE
     ========================================================= -->

<section
    id="mySchedule"
    class="tab-content"
>

    <div class="panel">

        <div class="month-controls">

            <button onclick="changeMonth(-1)">
                ◀
            </button>

            <div
                id="monthTitleMy"
                class="month-title"
            ></div>

            <button onclick="changeMonth(1)">
                ▶
            </button>

        </div>

        <div id="myScheduleContainer">
            <div class="loading">
                Зареждане...
            </div>
        </div>

    </div>

</section>


<!-- =========================================================
     ALL SCHEDULE
     ========================================================= -->

<section
    id="allSchedule"
    class="tab-content hidden"
>

    <div class="panel">

        <div class="month-controls">

            <button onclick="changeMonth(-1)">
                ◀
            </button>

            <div
                id="monthTitleAll"
                class="month-title"
            ></div>

            <button onclick="changeMonth(1)">
                ▶
            </button>

        </div>

        <div id="adminSaveArea" class="hidden" style="margin-bottom:15px;">
            <button
                id="saveAllScheduleButton"
                class="primary-button"
                onclick="saveAllScheduleChanges()"
            >
                💾 Запази промените
            </button>
        </div>

        <div id="allScheduleContainer">
            <div class="loading">
                Зареждане...
            </div>
        </div>

    </div>

</section>


<!-- =========================================================
     SWAPS
     ========================================================= -->

<section
    id="swaps"
    class="tab-content hidden"
>

    <div class="panel">

        <h2>🔄 Изпращане на смяна</h2>

        <div class="swap-form">

            <div class="form-group">
                <label>Моята дата</label>

                <input
                    type="date"
                    id="swapMyDate"
                >
            </div>


            <div class="form-group">
                <label>На кого</label>

                <select id="swapReceiver"></select>
            </div>


            <div class="form-group">
                <label>Дата на другия служител</label>

                <input
                    type="date"
                    id="swapReceiverDate"
                >
            </div>


            <div class="form-group full">

                <label>
                    Съобщение
                </label>

                <textarea
                    id="swapMessage"
                    rows="3"
                    placeholder="Напиши кратко съобщение..."
                ></textarea>

            </div>

        </div>

        <button
            class="primary-button"
            onclick="sendSwapRequest()"
        >
            Изпрати заявка
        </button>

    </div>


    <div class="panel">

        <h2>📨 Заявки</h2>

        <div id="swapRequestsContainer">
            <div class="loading">
                Зареждане...
            </div>
        </div>

    </div>

</section>


<!-- =========================================================
     ADMIN
     ========================================================= -->

<section
    id="admin"
    class="tab-content hidden"
>

    <!-- ADD USER -->

    <div class="panel">

        <h2>👤 Добавяне на потребител</h2>

        <div class="form-group">

            <label>Име</label>

            <input
                id="newUserName"
                type="text"
                placeholder="Например Георги Иванов"
            >

        </div>


        <div class="form-group">

            <label>Парола</label>

            <input
                id="newUserPassword"
                type="text"
                placeholder="Парола"
            >

        </div>


        <div class="checkbox-row">

            <label>
                <input
                    type="checkbox"
                    id="newUserAdmin"
                >
                Администратор
            </label>

            <label>
                <input
                    type="checkbox"
                    id="newUserSeptemberOnly"
                >
                Само за септември
            </label>

        </div>

        <br>

        <button
            class="primary-button"
            onclick="addUser()"
        >
            ➕ Добави потребител
        </button>

    </div>


    <!-- USERS -->

    <div class="panel">

        <h2>👥 Потребители</h2>

        <div id="adminUsersContainer">
            <div class="loading">
                Зареждане...
            </div>
        </div>

    </div>


    <!-- SHIFT TYPES -->

    <div class="panel">

        <h2>🕐 Видове смени</h2>

        <div id="shiftTypesContainer"></div>

        <hr style="border:0;border-top:1px solid var(--border);margin:20px 0;">

        <h3>Добавяне на смяна</h3>

        <div class="form-group">
            <label>Име</label>

            <input
                id="newShiftName"
                placeholder="Например Нощна"
            >
        </div>

        <div class="form-group">
            <label>Начало</label>

            <input
                id="newShiftStart"
                type="time"
            >
        </div>

        <div class="form-group">
            <label>Край</label>

            <input
                id="newShiftEnd"
                type="time"
            >
        </div>

        <div class="form-group">
            <label>Почивка в минути</label>

            <input
                id="newShiftBreak"
                type="number"
                value="60"
                min="0"
            >
        </div>

        <button
            class="primary-button"
            onclick="addShiftType()"
        >
            ➕ Добави смяна
        </button>

    </div>

</section>

</main>

</div>
