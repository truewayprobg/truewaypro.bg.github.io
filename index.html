<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">

<title>Работен график</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #202124;
    --muted: #6b7280;
    --border: #dfe3e8;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --success: #16a34a;
    --warning: #d97706;
    --input: #ffffff;
}

body.dark {
    --bg: #111827;

    --text: #f3f4f6;

    --border: #374151;
    --primary: #3b82f6;

body {

input,

}

}

.hidden {

}

/* =========================================================
   LOGIN
   ========================================================= */

#loginScreen {

    padding: 20px;
}

.form-group {

.form-group label {

}

.login-button {

    border-radius: 10px;

    font-weight: bold;

.login-button:hover {

.login-error {
    color: var(--danger);

/* =========================================================
   APP
   ========================================================= */

#app {
    min-height: 100vh;
}

header {
    background: var(--card);
    border-bottom: 1px solid var(--border);

}

.header-inner {

.logo {

.user-info {

.small-button {

.tab {

    color: var(--text);

/* =========================================================
   BUTTONS

.primary-button:hover {

/* =========================================================
   SWAPS

.swap-form {

.swap-form .full {

.swap-request {

.status {

.status.pending {

}

.status.accepted {

.status.rejected {

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 800px) {
    .header-inner {
        align-items: flex-start;

}

.loading {

    color: var(--muted);
}
</style>
</head>

<script>

/* =========================================================

const SUPABASE_URL =
    "https://feahxunujegspmfgicfw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qtFfIY15FcRdBcUzTW56Jg_bGXHiLgR";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIABLES
   ========================================================= */

let USERS = [];

let currentUser = null;

let currentDate = new Date();

let scheduleData = {};

let shiftTypes = [
    {
        name: "1-ва смяна",
        start: "09:00",
        end: "16:00",
        break: 60,
        active: true
    },
    {

        start: "14:00",
        end: "21:00",
        break: 60,
        active: true
    },
    {
        name: "Р",
        start: "09:00",
        end: "18:00",
        break: 60,
        active: true
    },
    {
        name: "Управител",
        start: "09:00",
        end: "17:00",
        break: 60,
        active: true
    },
    {
        name: "Ц",
        start: "09:00",
        end: "21:00",
        break: 60,
        active: true
    },
    {
        name: "Отпуска",
        start: null,
        end: null,
        break: 0,
        active: true
    },
    {
        name: "Самоотлъчка",
        start: null,
        end: null,
        break: 0,
        active: true
    },
    {
        name: "Персонална",
        start: null,
        end: null,
        break: 0,
        active: true
    }
];


/* =========================================================
   MONTHS
   ========================================================= */

const MONTHS = [
    "Януари",
    "Февруари",
    "Март",
    "Април",
    "Май",
    "Юни",
    "Юли",
    "Август",
    "Септември",
    "Октомври",
    "Ноември",
    "Декември"
];


/* =========================================================
   INITIALIZATION
   ========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

    loadShiftTypes();

    await loadUsersFromSupabase();

    populateLoginUsers();

    const savedUser =
        localStorage.getItem("work_schedule_user");

    if (savedUser) {

        const foundUser =
            USERS.find(u => u.name === savedUser);

        if (foundUser && foundUser.active) {

            currentUser = foundUser;

            await showApp();

        } else {

            localStorage.removeItem(
                "work_schedule_user"
            );

        }

    }

});


/* =========================================================
   LOAD USERS
   ========================================================= */

async function loadUsersFromSupabase() {

    const { data, error } =
        await supabaseClient
            .from("app_users")
            .select("*")
            .order("name", {
                ascending: true
            });

    if (error) {

        console.error(error);

        alert(
            "Грешка при зареждането на потребителите."
        );

        return false;
    }

    USERS = (data || []).map(user => ({

        id: user.id,

        name: user.name,

        password: user.password,

        admin: user.admin,

        active: user.active,

        septemberOnly:
            user.september_only

    }));

    return true;
}


/* =========================================================
   LOGIN USERS DROPDOWN
   ========================================================= */

function populateLoginUsers() {

    const select =
        document.getElementById("loginName");

    select.innerHTML =
        `<option value="">Избери потребител</option>`;

    USERS
        .filter(u => u.active)
        .forEach(user => {

            const option =
                document.createElement("option");

            option.value = user.name;

            option.textContent = user.name;

            select.appendChild(option);

        });

}


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

    const name =
        document.getElementById("loginName").value;

    const password =
        document.getElementById("loginPassword").value;

    const errorBox =
        document.getElementById("loginError");

    errorBox.classList.add("hidden");

    if (!name) {

        showLoginError(
            "Моля, избери потребител."
        );

        return;
    }

    const { data, error } =
        await supabaseClient
            .from("app_users")
            .select("*")
            .eq("name", name)
            .eq("active", true)
            .maybeSingle();

    if (error) {

        console.error(error);

        showLoginError(
            "Възникна грешка при вход."
        );

        return;
    }

    if (!data || data.password !== password) {

        showLoginError(
            "Грешно име или парола."
        );

        return;
    }

    currentUser = {

        id: data.id,

        name: data.name,

        password: data.password,

        admin: data.admin,

        active: data.active,

        septemberOnly:
            data.september_only

    };

    localStorage.setItem(
        "work_schedule_user",
        currentUser.name
    );

    await showApp();
}


/* =========================================================
   SHOW APP
   ========================================================= */

async function showApp() {

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    document
        .getElementById("currentUserName")
        .textContent =
        currentUser.name;

    if (currentUser.admin) {

        document
            .getElementById("adminTab")
            .classList.remove("hidden");

        document
            .getElementById("adminSaveArea")
            .classList.remove("hidden");

    } else {

        document
            .getElementById("adminTab")
            .classList.add("hidden");

        document
            .getElementById("adminSaveArea")
            .classList.add("hidden");

    }

    applyTheme();

    await loadSchedule();

    renderAll();

}


/* =========================================================
   LOGOUT
   ========================================================= */

function logout() {

    currentUser = null;

    localStorage.removeItem(
        "work_schedule_user"
    );

    document
        .getElementById("app")
        .classList.add("hidden");

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    document
        .getElementById("loginPassword")
        .value = "";

    populateLoginUsers();

}


/* =========================================================
   LOGIN ERROR
   ========================================================= */

function showLoginError(message) {

    const box =
        document.getElementById("loginError");

    box.textContent = message;

    box.classList.remove("hidden");

}


/* =========================================================
   THEME
   ========================================================= */

function toggleTheme() {

    const key =
        "theme_" + currentUser.name;

    const dark =
        !document.body.classList.contains("dark");

    if (dark) {

        document.body.classList.add("dark");

        localStorage.setItem(
            key,
            "dark"
        );

    } else {

        document.body.classList.remove("dark");

        localStorage.setItem(
            key,
            "light"
        );

    }

}


function applyTheme() {

    const key =
        "theme_" + currentUser.name;

    const theme =
        localStorage.getItem(key);

    document.body.classList.toggle(
        "dark",
        theme === "dark"
    );

}


/* =========================================================
   TABS
   ========================================================= */

function openTab(tabId) {

    document
        .querySelectorAll(".tab-content")
        .forEach(section => {

            section.classList.add("hidden");

        });

    document
        .getElementById(tabId)
        .classList.remove("hidden");

    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.remove("active");

        });

    const activeTab =
        document.querySelector(
            `.tab[data-tab="${tabId}"]`
        );

    if (activeTab) {
        activeTab.classList.add("active");
    }

    if (tabId === "swaps") {
        loadSwapRequests();
    }

    if (tabId === "admin") {

        if (!currentUser.admin) {
            openTab("mySchedule");
            return;
        }

        renderAdminUsers();
        renderShiftTypes();

    }

}

function changeMonth(direction) {

    );

}


/* =========================================================
   DATE HELPERS
   ========================================================= */

function getDaysInMonth(date) {

    return new Date(
        date.getFullYear(),
        date.getMonth() + 1,
        0
    ).getDate();

}


function formatDate(year, month, day) {

    return (
        year +
        "-" +
        String(month + 1).padStart(2, "0") +
        "-" +
        String(day).padStart(2, "0")
    );

}


function isWeekend(year, month, day) {

    const date =
        new Date(year, month, day);

    const weekday =
        date.getDay();

    return weekday === 0 || weekday === 6;

}


/* =========================================================
   SHIFT HELPERS
   ========================================================= */

function getShiftByName(name) {

    if (!name) return null;

    return shiftTypes.find(
        shift => shift.name === name
    ) || null;

}


function shiftDisplay(shiftName) {

    const shift =
        getShiftByName(shiftName);

    if (!shift) {

        return {
            text: "П",
            time: ""
        };

    }

    let time = "";

    if (shift.start && shift.end) {

        time =
            shift.start +
            "–" +
            shift.end;

    }

    return {
        text: shift.name,
        time: time
    };

}


/* =========================================================
   LOAD SCHEDULE
   ========================================================= */

async function loadSchedule() {

    const { data, error } =
        await supabaseClient
            .from("work_schedule")
            .select("*");

    if (error) {

        console.error(error);

        alert(
            "Грешка при зареждането на графика."
        );

        return;
    }

    scheduleData = {};

    (data || []).forEach(row => {

        const key =
            row.employee +
            "|" +
            row.work_date;

        scheduleData[key] = row.shift_type || "";

    });

}


/* =========================================================
   GET SHIFT
   ========================================================= */

function getScheduleShift(employee, date) {

    const key =
        employee +
        "|" +
        date;

    return scheduleData[key] || "";

}

/* =========================================================
   MY SCHEDULE
   ========================================================= */

function renderMySchedule() {

    renderMonthTitles();

    const container =
        document.getElementById(
            "myScheduleContainer"
        );

    if (!currentUser) return;

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();

    const days =
        getDaysInMonth(currentDate);

    let html =
        `<div class="table-wrap">
        <table class="schedule-table">
        <thead>
        <tr>
        <th class="employee-header">Служител</th>`;

    for (let day = 1; day <= days; day++) {

        const date =
            new Date(year, month, day);

        const weekday =
            date.toLocaleDateString(
                "bg-BG",
                { weekday: "short" }
            );

        html += `
            <th>
                ${day}<br>
                ${weekday}
            </th>
        `;

    }

    html += `
        </tr>
        </thead>
        <tbody>
    `;

    html += `<tr>`;

    html += `
        <td class="employee-name">
            ${escapeHtml(currentUser.name)}
        </td>
    `;

    for (let day = 1; day <= days; day++) {

        const date =
            formatDate(year, month, day);

        const shiftName =
            getScheduleShift(
                currentUser.name,
                date
            );

        const display =
            shiftDisplay(shiftName);

        const weekend =
            isWeekend(
                year,
                month,
                day
            );

        html += `
            <td class="day-cell ${weekend ? "weekend" : ""}">
                <div class="day-number">
                    ${day}
                </div>

                <div class="shift-text">
                    ${escapeHtml(display.text)}
                </div>

                <div class="shift-time">
                    ${escapeHtml(display.time)}
                </div>
            </td>
        `;

    }

    html += `
        </tr>
        </tbody>
        </table>
        </div>
    `;

    container.innerHTML = html;

}


/* =========================================================
   ALL SCHEDULE
   ========================================================= */

function renderAllSchedule() {

    renderMonthTitles();

    const container =
        document.getElementById(
            "allScheduleContainer"
        );

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();

    const days =
        getDaysInMonth(currentDate);

    const visibleUsers =
        USERS.filter(user => {

            if (!user.active) {
                return false;
            }

            if (
                user.septemberOnly &&
                month !== 8
            ) {
                return false;
            }

            return true;

        });

    let html =
        `<div class="table-wrap">
        <table class="schedule-table">
        <thead>
        <tr>
        <th class="employee-header">Служител</th>`;

    for (let day = 1; day <= days; day++) {

        const date =
            new Date(year, month, day);

        const weekday =
            date.toLocaleDateString(
                "bg-BG",
                { weekday: "short" }
            );

        html += `
            <th>
                ${day}<br>
                ${weekday}
            </th>
        `;

    }

    html += `
        </tr>
        </thead>
        <tbody>
    `;

    visibleUsers.forEach(user => {

        html += `<tr>`;

        html += `
            <td class="employee-name">
                ${escapeHtml(user.name)}
            </td>
        `;

        for (let day = 1; day <= days; day++) {

            const date =
                formatDate(year, month, day);

            const shift =
                getScheduleShift(
                    user.name,
                    date
                );

            const weekend =
                isWeekend(
                    year,
                    month,
                    day
                );

            if (currentUser.admin) {

                let options =
                    `<option value="">П</option>`;

                shiftTypes
                    .filter(s => s.active)
                    .forEach(s => {

                        const selected =
                            shift === s.name
                                ? "selected"
                                : "";

                        options += `
                            <option
                                value="${escapeAttribute(s.name)}"
                                ${selected}
                            >
                                ${escapeHtml(s.name)}
                            </option>
                        `;

                    });

                html += `
                    <td class="day-cell ${weekend ? "weekend" : ""}">
                        <div class="day-number">
                            ${day}
                        </div>

                        <select
                            class="shift-select admin-shift-select"
                            data-employee="${escapeAttribute(user.name)}"
                            data-date="${date}"
                        >
                            ${options}
                        </select>
                    </td>
                `;

            } else {

                const display =
                    shiftDisplay(shift);

                html += `
                    <td class="day-cell ${weekend ? "weekend" : ""}">
                        <div class="day-number">
                            ${day}
                        </div>

                        <div class="shift-text">
                            ${escapeHtml(display.text)}
                        </div>

                        <div class="shift-time">
                            ${escapeHtml(display.time)}
                        </div>
                    </td>
                `;

            }

        }

        html += `</tr>`;

    });

    html += `
        </tbody>
        </table>
        </div>
    `;

    container.innerHTML = html;

}


/* =========================================================
   SAVE ALL SCHEDULE CHANGES
   ========================================================= */

async function saveAllScheduleChanges() {

    if (!currentUser || !currentUser.admin) {

        alert(
            "Нямате права за редактиране."
        );

        return;
    }

    const selects =
        document.querySelectorAll(
            ".admin-shift-select"
        );

    if (!selects.length) return;

    const scrollPosition =
        window.scrollY;

    const button =
        document.getElementById(
            "saveAllScheduleButton"
        );

    button.disabled = true;

    button.textContent =
        "⏳ Запазване...";

    try {

        for (const select of selects) {

            const employee =
                select.dataset.employee;

            const date =
                select.dataset.date;

            const shiftName =
                select.value || null;

            const shift =
                getShiftByName(shiftName);

            const values = {

                employee: employee,

                work_date: date,

                shift_type: shiftName,

                start_time:
                    shift?.start || null,

                end_time:
                    shift?.end || null,

                break_time:
                    shift?.break ?? 0,

                updated_at:
                    new Date().toISOString()

            };

            const { error } =
                await supabaseClient
                    .from("work_schedule")
                    .upsert(
                        values,
                        {
                            onConflict:
                                "employee,work_date"
                        }
                    );

            if (error) {
                throw error;
            }

        }

        await loadSchedule();

        renderAllSchedule();

        window.scrollTo(
            0,
            scrollPosition
        );

        alert(
            "Графикът е записан успешно."
        );

    } catch (error) {

        console.error(error);

        alert(
            "Грешка при записването на графика."
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "💾 Запази промените";

    }

}


/* =========================================================
   ADD USER
   ========================================================= */

async function addUser() {

    if (!currentUser || !currentUser.admin) {

        alert(
            "Нямате права за тази операция."
        );

        return;
    }

    const name =
        document
            .getElementById("newUserName")
            .value
            .trim();

    const password =
        document
            .getElementById("newUserPassword")
            .value
            .trim();

    const admin =
        document
            .getElementById("newUserAdmin")
            .checked;

    const septemberOnly =
        document
            .getElementById("newUserSeptemberOnly")
            .checked;

    if (!name) {

        alert(
            "Моля, въведете име."
        );

        return;
    }

    const { data: existing, error: checkError } =
        await supabaseClient
            .from("app_users")
            .select("id")
            .eq("name", name)
            .maybeSingle();

    if (checkError) {

        console.error(checkError);

        alert(
            "Грешка при проверката."
        );

        return;
    }

    if (existing) {

        alert(
            "Потребител с това име вече съществува."
        );

        return;
    }

    const { error } =
        await supabaseClient
            .from("app_users")
            .insert({

                name: name,

                password: password,

                admin: admin,

                active: true,

                september_only:
                    septemberOnly

            });

    if (error) {

        console.error(error);

        alert(
            "Грешка при добавянето."
        );

        return;
    }

    await loadUsersFromSupabase();

    document
        .getElementById("newUserName")
        .value = "";

    document
        .getElementById("newUserPassword")
        .value = "";

    document
        .getElementById("newUserAdmin")
        .checked = false;

    document
        .getElementById("newUserSeptemberOnly")
        .checked = false;

    populateLoginUsers();

    renderAdminUsers();

    renderAllSchedule();

    updateSwapReceiver();

    alert(
        "Потребителят е добавен успешно."
    );

}

/* =========================================================
   SAVE USER
   ========================================================= */

async function saveUser(userId) {

    if (!currentUser.admin) {

        alert(
            "Нямате права."
        );

        return;
    }

    const nameInput =
        document.querySelector(
            `.admin-name[data-id="${userId}"]`
        );

    const passwordInput =
        document.querySelector(
            `.admin-password[data-id="${userId}"]`
        );

    const activeInput =
        document.querySelector(
            `.admin-active[data-id="${userId}"]`
        );

    const adminInput =
        document.querySelector(
            `.admin-is-admin[data-id="${userId}"]`
        );

    const septemberInput =
        document.querySelector(
            `.admin-september[data-id="${userId}"]`
        );

    if (!nameInput) return;

    const name =
        nameInput.value.trim();

    if (!name) {

        alert(
            "Името не може да е празно."
        );

        return;
    }

    const { error } =
        await supabaseClient
            .from("app_users")
            .update({

                name: name,

                password:
                    passwordInput.value,

                active:
                    activeInput.checked,

                admin:
                    adminInput.checked,

                september_only:
                    septemberInput.checked,

                updated_at:
                    new Date().toISOString()

            })
            .eq("id", userId);

    if (error) {

        console.error(error);

        alert(
            "Грешка при запазването."
        );

        return;
    }

    await loadUsersFromSupabase();

    populateLoginUsers();

    renderAdminUsers();

    renderAllSchedule();

    alert(
        "Потребителят е запазен."
    );

}


/* =========================================================

function loadShiftTypes() {

}

/* =========================================================
   ADD SHIFT TYPE
   ========================================================= */

function addShiftType() {

    const name =
        document
            .getElementById("newShiftName")
            .value
            .trim();

    const start =
        document
            .getElementById("newShiftStart")
            .value || null;

    const end =
        document
            .getElementById("newShiftEnd")
            .value || null;

    const breakTime =
        Number(
            document
                .getElementById("newShiftBreak")
                .value
        ) || 0;

    if (!name) {

        alert(
            "Въведи име на смяната."
        );

        return;
    }

    shiftTypes.push({

        name: name,

        start: start,

        end: end,

        break: breakTime,

        active: true

    });

    saveShiftTypes();

    renderShiftTypes();

    renderAllSchedule();

    document
        .getElementById("newShiftName")
        .value = "";

    document
        .getElementById("newShiftStart")
        .value = "";

    document
        .getElementById("newShiftEnd")
        .value = "";

}


/* =========================================================
   SAVE SHIFT TYPE
   ========================================================= */

function saveShiftType(index) {

    const name =
        document
            .getElementById(
                `shift-name-${index}`
            )
            .value
            .trim();

    const start =
        document
            .getElementById(
                `shift-start-${index}`
            )
            .value || null;

    const end =
        document
            .getElementById(
                `shift-end-${index}`
            )
            .value || null;

    const breakTime =
        Number(
            document
                .getElementById(
                    `shift-break-${index}`
                )
                .value
        ) || 0;

    if (!name) {

        alert(
            "Името не може да е празно."
        );

        return;
    }

    shiftTypes[index] = {

        ...shiftTypes[index],

        name: name,

        start: start,

        end: end,

        break: breakTime

    };

    saveShiftTypes();

    renderShiftTypes();

    renderAllSchedule();

    alert(
        "Смяната е запазена."
    );

}


/* =========================================================
   TOGGLE SHIFT
   ========================================================= */

function toggleShiftType(index) {

    shiftTypes[index].active =
        !shiftTypes[index].active;

    saveShiftTypes();

    renderShiftTypes();

    renderAllSchedule();

}


/* =========================================================
   SWAPS
   ========================================================= */

function updateSwapReceiver() {

    const select =
        document.getElementById(
            "swapReceiver"
        );

    if (!select) return;

    select.innerHTML =
        `<option value="">Избери служител</option>`;

    USERS
        .filter(u =>
            u.active &&
            u.name !== currentUser.name
        )
        .forEach(user => {

            const option =
                document.createElement("option");

            option.value = user.name;

            option.textContent = user.name;

            select.appendChild(option);

        });

}


async function sendSwapRequest() {

    const proposerDate =
        document
            .getElementById("swapMyDate")
            .value;

    const receiver =
        document
            .getElementById("swapReceiver")
            .value;

    const receiverDate =
        document
            .getElementById("swapReceiverDate")
            .value;

    const message =
        document
            .getElementById("swapMessage")
            .value
            .trim();

    if (
        !proposerDate ||
        !receiver ||
        !receiverDate
    ) {

        alert(
            "Попълни всички полета."
        );

        return;
    }

    const { error } =
        await supabaseClient
            .from("shift_requests")
            .insert({

                proposer:
                    currentUser.name,

                receiver:
                    receiver,

                proposer_date:
                    proposerDate,

                receiver_date:
                    receiverDate,

                message:
                    message,

                status:
                    "pending"

            });

    if (error) {

        console.error(error);

        alert(
            "Грешка при изпращането."
        );

        return;
    }

    document
        .getElementById("swapMessage")
        .value = "";

    alert(
        "Заявката е изпратена."
    );

    await loadSwapRequests();

}


/* =========================================================
   LOAD SWAP REQUESTS
   ========================================================= */

async function loadSwapRequests() {

    const container =
        document.getElementById(
            "swapRequestsContainer"
        );

    if (!container) return;

    container.innerHTML =
        `<div class="loading">
            Зареждане...
        </div>`;

    let query =
        supabaseClient
            .from("shift_requests")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );

    if (!currentUser.admin) {

        query =
            query.or(
                `proposer.eq.${currentUser.name},receiver.eq.${currentUser.name}`
            );

    }

    const { data, error } =
        await query;

    if (error) {

        console.error(error);

        container.innerHTML =
            `<p>Грешка при зареждането.</p>`;

        return;
    }

    if (!data || !data.length) {

        container.innerHTML =
            `<p style="color:var(--muted)">
                Няма заявки.
            </p>`;

        updateSwapReceiver();

        return;
    }

    container.innerHTML = "";

    data.forEach(request => {

        const div =
            document.createElement("div");

        div.className =
            "swap-request";

        let statusClass =
            "pending";

        if (request.status === "accepted") {
            statusClass = "accepted";
        }

        if (request.status === "rejected") {
            statusClass = "rejected";
        }

        let buttons = "";

        if (
            request.receiver === currentUser.name &&
            request.status === "pending"
        ) {

            buttons += `
                <button
                    class="success-button"
                    onclick="respondSwap(${request.id}, 'accepted')"
                >
                    ✔ Приеми
                </button>

                <button
                    class="danger-button"
                    onclick="respondSwap(${request.id}, 'rejected')"
                >
                    ✖ Откажи
                </button>
            `;

        }

        if (
            currentUser.admin &&
            request.status === "accepted"
        ) {

            buttons += `
                <button
                    class="primary-button"
                    onclick="approveSwap(${request.id})"
                >
                    ✔ Одобри размяната
                </button>
            `;

        }

        div.innerHTML = `

            <div>
                <strong>
                    ${escapeHtml(request.proposer)}
                </strong>

                → 

                <strong>
                    ${escapeHtml(request.receiver)}
                </strong>
            </div>

            <div style="margin-top:7px;">
                ${escapeHtml(request.proposer_date)}
                ↔
                ${escapeHtml(request.receiver_date)}
            </div>

            ${
                request.message
                ? `
                    <div style="margin-top:7px;">
                        💬 ${escapeHtml(request.message)}
                    </div>
                `
                : ""
            }

            <div style="margin-top:10px;">
                <span class="status ${statusClass}">
                    ${escapeHtml(request.status)}
                </span>
            </div>

            ${
                buttons
                ? `
                    <div style="
                        display:flex;
                        gap:8px;
                        margin-top:12px;
                        flex-wrap:wrap;
                    ">
                        ${buttons}
                    </div>
                `
                : ""
            }

        `;

        container.appendChild(div);

    });

    updateSwapReceiver();

}


/* =========================================================
   RESPOND SWAP
   ========================================================= */

async function respondSwap(
    id,
    status
) {

    const { error } =
        await supabaseClient
            .from("shift_requests")
            .update({

                status:
                    status,

                receiver_response_at:
                    new Date().toISOString()

            })
            .eq("id", id)
            .eq("receiver", currentUser.name);

    if (error) {

        console.error(error);

        alert(
            "Грешка."
        );

        return;
    }

    await loadSwapRequests();

}


/* =========================================================
   ADMIN APPROVE SWAP
   ========================================================= */

async function approveSwap(id) {

    if (!currentUser.admin) {

        alert(
            "Нямате права."
        );

        return;
    }

    const { data: request, error } =
        await supabaseClient
            .from("shift_requests")
            .select("*")
            .eq("id", id)
            .maybeSingle();

    if (error || !request) {

        alert(
            "Заявката не е намерена."
        );

        return;
    }

    if (request.status !== "accepted") {

        alert(
            "Заявката трябва първо да бъде приета."
        );

        return;
    }

    const { data: proposerShift } =
        await supabaseClient
            .from("work_schedule")
            .select("*")
            .eq("employee", request.proposer)
            .eq("work_date", request.proposer_date)
            .maybeSingle();

    const { data: receiverShift } =
        await supabaseClient
            .from("work_schedule")
            .select("*")
            .eq("employee", request.receiver)
            .eq("work_date", request.receiver_date)
            .maybeSingle();

    if (proposerShift) {

        await supabaseClient
            .from("work_schedule")
            .upsert({

                employee:
                    request.receiver,

                work_date:
                    request.receiver_date,

                shift_type:
                    proposerShift.shift_type,

                start_time:
                    proposerShift.start_time,

                end_time:
                    proposerShift.end_time,

                break_time:
                    proposerShift.break_time,

                updated_at:
                    new Date().toISOString()

            }, {
                onConflict:
                    "employee,work_date"
            });

    }

    if (receiverShift) {

        await supabaseClient
            .from("work_schedule")
            .upsert({

                employee:
                    request.proposer,

                work_date:
                    request.proposer_date,

                shift_type:
                    receiverShift.shift_type,

                start_time:
                    receiverShift.start_time,

                end_time:
                    receiverShift.end_time,

                break_time:
                    receiverShift.break_time,

                updated_at:
                    new Date().toISOString()

            }, {
                onConflict:
                    "employee,work_date"
            });

    }

    await supabaseClient
        .from("shift_requests")
        .update({

            status:
                "completed",

            admin_decision_at:
                new Date().toISOString()

        })
        .eq("id", id);

    await loadSchedule();

    renderAll();

    await loadSwapRequests();

    alert(
        "Размяната е одобрена."
    );

}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return escapeHtml(value);

}
