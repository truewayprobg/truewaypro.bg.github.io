<!DOCTYPE html>

<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Работен график</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg:#f3f4f6;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --border:#d1d5db;
    --primary:#2563eb;
    --primary-hover:#1d4ed8;
    --danger:#dc2626;
    --success:#16a34a;
    --input:#ffffff;
    --table:#ffffff;
}

body.dark {
    --bg:#111827;
    --card:#1f2937;
    --text:#f9fafb;
    --muted:#9ca3af;
    --border:#374151;
    --primary:#3b82f6;
    --primary-hover:#60a5fa;
    --danger:#ef4444;
    --success:#22c55e;
    --input:#111827;
    --table:#1f2937;
}

* {
    box-sizing:border-box;
}

body {
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:.2s;
}

button,
input,
select,
textarea {
    font:inherit;
}

button {
    cursor:pointer;
}

.hidden {
    display:none !important;
}

.container {
    width:min(1500px,96%);
    margin:20px auto;
}

.card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.login-wrap {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-card {
    width:min(430px,100%);
}

h1,h2,h3 {
    margin-top:0;
}

label {
    display:block;
    margin:10px 0 6px;
    font-weight:600;
}

input,
select,
textarea {
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--input);
    color:var(--text);
    outline:none;
}

textarea {
    min-height:80px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus {
    border-color:var(--primary);
}

button {
    border:0;
    border-radius:9px;
    padding:10px 14px;
    background:var(--primary);
    color:white;
}

button:hover {
    background:var(--primary-hover);
}

button.secondary {
    background:#6b7280;
}

button.danger {
    background:var(--danger);
}

button.success {
    background:var(--success);
}

button.small {
    padding:7px 10px;
    font-size:13px;
}

.topbar {
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.topbar-left,
.topbar-right {
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
}

.user-name {
    font-weight:bold;
}

.tabs {
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.tab {
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
}

.tab.active {
    background:var(--primary);
    color:white;
    border-color:var(--primary);
}

.month-nav {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.month-title {
    font-size:20px;
    font-weight:bold;
    min-width:190px;
    text-align:center;
}

.table-wrap {
    overflow:auto;
    border:1px solid var(--border);
    border-radius:10px;
}

table {
    width:100%;
    border-collapse:collapse;
    min-width:900px;
    background:var(--table);
}

th,
td {
    border:1px solid var(--border);
    padding:7px;
    text-align:center;
    white-space:nowrap;
}

th {
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:2;
}

.employee-cell {
    text-align:left;
    font-weight:bold;
    position:sticky;
    left:0;
    background:var(--table);
    z-index:1;
}

.shift-cell {
    min-width:105px;
    font-size:12px;
}

.shift-cell.work {
    background:rgba(34,197,94,.13);
}

.shift-cell.rest {
    color:var(--muted);
}

.shift-cell.leave {
    background:rgba(59,130,246,.13);
}

.shift-cell.absent {
    background:rgba(239,68,68,.13);
}

.shift-cell.personal {
    background:rgba(168,85,247,.13);
}

.day-number {
    font-weight:bold;
}

.day-name {
    color:var(--muted);
    font-size:11px;
}

.admin-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

@media(max-width:900px) {
    .admin-grid {
        grid-template-columns:1fr;
    }
}

.form-grid {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}

@media(max-width:650px) {
    .form-grid {
        grid-template-columns:1fr;
    }
}

.admin-user,
.admin-shift {
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    margin-top:8px;
}

.admin-user-grid {
    display:grid;
    grid-template-columns:1.5fr .8fr .8fr .8fr auto;
    gap:8px;
    align-items:center;
}

@media(max-width:1000px) {
    .admin-user-grid {
        grid-template-columns:1fr 1fr;
    }
}

.admin-shift-grid {
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr .8fr auto;
    gap:8px;
    align-items:center;
}

@media(max-width:900px) {
    .admin-shift-grid {
        grid-template-columns:1fr 1fr;
    }
}

.checkbox-line {
    display:flex;
    gap:7px;
    align-items:center;
}

.checkbox-line input {
    width:auto;
}

.notice {
    padding:10px 12px;
    border-radius:9px;
    background:var(--bg);
    margin:10px 0;
}

.error {
    color:var(--danger);
    margin-top:10px;
}

.success-msg {
    color:var(--success);
    margin-top:10px;
}

.request {
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    margin-top:10px;
}

.request-status {
    font-weight:bold;
}

.request-actions {
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:10px;
}

.editor-table select,
.editor-table input {
    min-width:120px;
}

.save-bar {
    position:sticky;
    bottom:10px;
    margin-top:12px;
    display:flex;
    justify-content:flex-end;
    z-index:5;
}

.empty {
    text-align:center;
    color:var(--muted);
    padding:25px;
}

.loading {
    color:var(--muted);
}

.badge {
    display:inline-block;
    padding:3px 7px;
    border-radius:20px;
    font-size:11px;
    background:var(--bg);
}

.footer-note {
    color:var(--muted);
    font-size:12px;
    margin-top:15px;
}
</style>

</head>

<body>

<div id="loginPage" class="login-wrap">
    <div class="card login-card">
        <h1>Работен график</h1>
        <p class="loading">Вход в системата</p>

    <label for="loginName">Име</label>
    <select id="loginName">

    <label for="loginPassword">Парола</label>

    </button>

</div>

<div id="appPage" class="hidden">

```
<div class="container">

    <div class="topbar card">
        <div class="topbar-left">
            <span>👤</span>
            <span id="currentUserName" class="user-name"></span>
            <span id="adminBadge" class="badge hidden">Администратор</span>
        </div>

        <div class="topbar-right">
            <button id="themeBtn" class="secondary small">

    <div class="tabs">
        <button class="tab active" data-tab="mySchedule">
            Моят график
        </button>

        <button class="tab" data-tab="allSchedule">

        </button>

        <button class="tab" data-tab="requests">
            Размени
        </button>

        <button id="adminTab" class="tab hidden" data-tab="admin">
            Администрация
        </button>
    </div>

    <main id="mainContent"></main>

</div>
```

<script>
const SUPABASE_URL = "https://feahxunujegspmfgicfw.supabase.co";
const SUPABASE_KEY = "sb_publishable_qtFfIY15FcRdBcUzTW56Jg_bGXHiLgR";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const TOKEN_KEY = "work_schedule_token";

const MONTHS = [
    {key:"2026-09", name:"Септември 2026"},
    {key:"2026-10", name:"Октомври 2026"},
    {key:"2026-11", name:"Ноември 2026"},
    {key:"2026-12", name:"Декември 2026"}
];

const DAYS_BG = [
    "Неделя",
    "Понеделник",
    "Вторник",
    "Сряда",
    "Четвъртък",
    "Петък",
    "Събота"
];

let sessionToken = localStorage.getItem(TOKEN_KEY);
let currentUser = null;
let currentTab = "mySchedule";
let currentMonth = "2026-09";
let shiftTypes = [];
let users = [];
let scheduleData = [];
let requests = [];
let pendingEditorChanges = {};

const initialData = {
    "Иван Панов": {
        "2026-09-28":"1-ва смяна",
        "2026-09-29":"1-ва смяна",
        "2026-09-30":"",
        "2026-10-01":"Р",
        "2026-10-02":"Ц"
    },
    "Алехандро Петров": {
        "2026-09-28":"2-ра смяна",
        "2026-09-29":"2-ра смяна",
        "2026-09-30":"1-ва смяна",
        "2026-10-01":"",
        "2026-10-02":"2-ра смяна"
    },
    "Велислав Вълов": {
        "2026-09-28":"1-ва смяна",
        "2026-09-29":"",
        "2026-09-30":"1-ва смяна",
        "2026-10-01":"2-ра смяна",
        "2026-10-02":"Р"
    },
    "Илион Иванов": {
        "2026-09-28":"2-ра смяна",
        "2026-09-29":"1-ва смяна",
        "2026-09-30":"2-ра смяна",
        "2026-10-01":"Р",
        "2026-10-02":""
    },
    "Илиян Игнатов": {
        "2026-09-28":"2-ра смяна",
        "2026-09-29":"2-ра смяна",
        "2026-09-30":"1-ва смяна"
    },
    "Денислав Андонов": {},
    "Петя": {}
};

const permanentUsers = [
    "Иван Панов",
    "Алехандро Петров",
    "Велислав Вълов",
    "Илион Иванов",
    "Петя"
];

function getToken() {
    return localStorage.getItem(TOKEN_KEY);
}

function setToken(token) {
    if (token) {
        localStorage.setItem(TOKEN_KEY, token);
        sessionToken = token;
    } else {
        localStorage.removeItem(TOKEN_KEY);
        sessionToken = null;
    }
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth()+1).padStart(2,"0");
    const d = String(date.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
}

function daysInMonth(monthKey) {
    const [year,month] = monthKey.split("-").map(Number);
    return new Date(year, month, 0).getDate();
}

function monthName(monthKey) {
    return MONTHS.find(x => x.key === monthKey)?.name || monthKey;
}

function isSeptemberOnly(name) {
    const u = users.find(x => x.name === name);
    return !!u?.september_only;
}

function getShiftType(name) {
    return shiftTypes.find(x => x.name === name);
}

function shiftClass(type) {
    if (!type) return "rest";
    if (type === "Отпуска") return "leave";
    if (type === "Самоотлъчка") return "absent";
    if (type === "Персонална") return "personal";
    return "work";
}

function shiftText(type) {
    if (!type) return "П";
    return type;
}

async function loadLoginUsers() {
    const {data,error} = await supabaseClient.rpc("list_login_users");

    const select = document.getElementById("loginName");

    if (error) {
        select.innerHTML = `<option value="">Грешка при зареждане</option>`;
        console.error(error);
        return;
    }

    select.innerHTML = `<option value="">Избери служител</option>`;

    (data || []).forEach(user => {
        const option = document.createElement("option");
        option.value = user.name;
        option.textContent = user.name;
        select.appendChild(option);
    });
}

async function login() {
    const name = document.getElementById("loginName").value;
    const password = document.getElementById("loginPassword").value;
    const errorBox = document.getElementById("loginError");

    errorBox.textContent = "";

    if (!name) {
        errorBox.textContent = "Избери име.";
        return;
    }

    const {data,error} = await supabaseClient.rpc("app_login", {
        p_name:name,
        p_password:password
    });

    if (error) {
        console.error(error);
        errorBox.textContent = error.message || "Грешка при вход.";
        return;
    }

    if (!data || !data.length) {
        errorBox.textContent = "Невалидно име или парола.";
        return;
    }

    const result = data[0];

    setToken(result.token);

    currentUser = {
        id:result.user_id,
        name:result.name,
        is_admin:result.is_admin,
        september_only:result.september_only,
        dark_mode:result.dark_mode
    };

    applyTheme(currentUser.dark_mode);

    await startApp();
}

async function restoreSession() {
    if (!sessionToken) {
        await loadLoginUsers();
        return;
    }

    const {data,error} = await supabaseClient.rpc("app_me", {
        p_token:sessionToken
    });

    if (error || !data || !data.length) {
        setToken(null);
        await loadLoginUsers();
        return;
    }

    currentUser = data[0];

    applyTheme(currentUser.dark_mode);

    await startApp();
}

async function logout() {
    if (sessionToken) {
        await supabaseClient.rpc("app_logout", {
            p_token:sessionToken
        });
    }

    setToken(null);
    currentUser = null;

    document.getElementById("appPage").classList.add("hidden");
    document.getElementById("loginPage").classList.remove("hidden");

    document.getElementById("loginPassword").value = "";

    await loadLoginUsers();
}

async function applyTheme(dark) {
    document.body.classList.toggle("dark",!!dark);

    const btn = document.getElementById("themeBtn");

    if (btn) {
        btn.textContent = dark
            ? "☀️ Светъл режим"
            : "🌙 Тъмен режим";
    }
}

async function toggleTheme() {
    if (!currentUser) return;

    const newValue = !document.body.classList.contains("dark");

    const {error} = await supabaseClient.rpc("set_dark_mode", {
        p_token:getToken(),
        p_dark:newValue
    });

    if (error) {
        alert(error.message);
        return;
    }

    currentUser.dark_mode = newValue;
    applyTheme(newValue);
}

async function loadShiftTypes() {
    const {data,error} = await supabaseClient.rpc("list_shift_types", {
        p_token:getToken()
    });

    if (error) {
        console.error(error);
        shiftTypes = [];
        return;
    }

    shiftTypes = data || [];
}

async function loadUsers() {
    if (!currentUser?.is_admin) return;

    const {data,error} = await supabaseClient.rpc("admin_list_users", {
        p_token:getToken()
    });

    if (error) {
        console.error(error);
        return;
    }

    users = data || [];
}

async function loadSchedule() {
    const {data,error} = await supabaseClient
        .from("work_schedule")
        .select("*");

    if (error) {
        console.error("Schedule error:",error);
        scheduleData = [];
        return;
    }

    scheduleData = data || [];
}

async function loadRequests() {
    const {data,error} = await supabaseClient
        .from("shift_requests")
        .select("*")
        .order("created_at",{ascending:false});

    if (error) {
        console.error("Request error:",error);
        requests = [];
        return;
    }

    requests = data || [];
}

async function startApp() {
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("appPage").classList.remove("hidden");

    document.getElementById("currentUserName").textContent =
        currentUser.name;

    document.getElementById("adminBadge").classList.toggle(
        "hidden",
        !currentUser.is_admin
    );

    document.getElementById("adminTab").classList.toggle(
        "hidden",
        !currentUser.is_admin
    );

    await loadShiftTypes();

    if (currentUser.is_admin) {
        await loadUsers();
    } else {
        const {data} = await supabaseClient.rpc("list_login_users", {});
        users = (data || []).map(x => ({
            name:x.name,
            september_only:false
        }));
    }

    await loadSchedule();
    await loadRequests();

    render();
}

function render() {
    if (currentTab === "mySchedule") {
        renderMySchedule();
    } else if (currentTab === "allSchedule") {
        renderAllSchedule();
    } else if (currentTab === "requests") {
        renderRequests();
    } else if (currentTab === "admin") {
        renderAdmin();
    }
}

function renderMonthNavigation() {
    const allowedMonths = currentUser?.september_only
        ? MONTHS.filter(x => x.key === "2026-09")
        : MONTHS;

    let html = `
        <div class="month-nav">
            <button class="secondary small" onclick="changeMonth(-1)">‹</button>
            <div class="month-title">${monthName(currentMonth)}</div>
            <button class="secondary small" onclick="changeMonth(1)">›</button>
        </div>
    `;

    html += `
        <div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:15px;">
    `;

    allowedMonths.forEach(m => {
        html += `
            <button
                class="${m.key === currentMonth ? "" : "secondary"} small"
                onclick="setMonth('${m.key}')">
                ${m.name}
            </button>
        `;
    });

    html += `</div>`;

    return html;
}

function setMonth(month) {
    currentMonth = month;
    render();
}

function changeMonth(direction) {
    const allowedMonths = currentUser?.september_only
        ? MONTHS.filter(x => x.key === "2026-09")
        : MONTHS;

    let index = allowedMonths.findIndex(x => x.key === currentMonth);

    if (index < 0) index = 0;

    index += direction;

    if (index < 0) index = 0;
    if (index >= allowedMonths.length) {
        index = allowedMonths.length - 1;
    }

    currentMonth = allowedMonths[index].key;
    render();
}

function getSchedule(employee,date) {
    return scheduleData.find(
        x => x.employee === employee && x.work_date === date
    );
}

function getInitialShift(employee,date) {
    return initialData?.[employee]?.[date];
}

function getEffectiveShift(employee,date) {
    const row = getSchedule(employee,date);

    if (row) {
        return row.shift_type || "";
    }

    return getInitialShift(employee,date) || "";
}

function employeeList() {
    if (currentUser?.is_admin) {
        return users.filter(x => {
            if (x.september_only && currentMonth !== "2026-09") {
                return false;
            }
            return x.is_active !== false;
        });
    }

    if (currentUser.september_only && currentMonth !== "2026-09") {
        return [];
    }

    return [{
        name:currentUser.name,
        september_only:currentUser.september_only
    }];
}

function renderScheduleTable(allEmployees) {
    const days = daysInMonth(currentMonth);

    if (!allEmployees.length) {
        return `<div class="empty">Няма данни за този месец.</div>`;
    }

    let html = `
        <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Служител</th>
    `;

    for (let d=1; d<=days; d++) {
        const date = new Date(
            Number(currentMonth.slice(0,4)),
            Number(currentMonth.slice(5,7))-1,
            d
        );

        html += `
            <th>
                <div class="day-number">${d}</div>
                <div class="day-name">${DAYS_BG[date.getDay()].slice(0,3)}</div>
            </th>
        `;
    }

    html += `
                </tr>
            </thead>
            <tbody>
    `;

    allEmployees.forEach(employee => {
        const name = employee.name;

        html += `
            <tr>
                <td class="employee-cell">${escapeHtml(name)}</td>
        `;

        for (let d=1; d<=days; d++) {
            const date =
                `${currentMonth}-${String(d).padStart(2,"0")}`;

            const type = getEffectiveShift(name,date);
            const st = getShiftType(type);

            let extra = "";

            if (st?.start_time && st?.end_time) {
                const start = String(st.start_time).slice(0,5);
                const end = String(st.end_time).slice(0,5);
                extra = `<div>${start}–${end}</div>`;
            }

            if (st?.break_minutes) {
                extra += `<small>${st.break_minutes} мин. почивка</small>`;
            }

            html += `
                <td class="shift-cell ${shiftClass(type)}">
                    <strong>${escapeHtml(shiftText(type))}</strong>
                    ${extra}
                </td>
            `;
        }

        html += `</tr>`;
    });

    html += `
            </tbody>
        </table>
        </div>
    `;

    return html;
}

function renderMySchedule() {
    const main = document.getElementById("mainContent");

    main.innerHTML = `
        <div class="card">

async function adminDecision(id,approved) {
const request = requests.find(x => x.id === id);

```
if (!request) return;

if (!approved) {
    const {error} = await supabaseClient
        .from("shift_requests")
        .update({
            status:"admin_rejected",
            admin_decision_at:new Date().toISOString()
        })
        .eq("id",id);

    if (error) {
        alert(error.message);
        return;
    }

    await loadRequests();
    renderRequests();
    return;
}

const proposerShift =
    getEffectiveShift(request.proposer,request.proposer_date);

const receiverShift =
    getEffectiveShift(request.receiver,request.receiver_date);

if (!proposerShift || !receiverShift) {
    alert("Не могат да се разменят празни смени.");
    return;
}

const ok1 = await saveScheduleRow(
    request.proposer,
    request.proposer_date,
    receiverShift
);

const ok2 = await saveScheduleRow(
    request.receiver,
    request.receiver_date,
    proposerShift
);

if (!ok1 || !ok2) {
    alert("Грешка при размяната.");
    return;
}

const {error} = await supabaseClient
    .from("shift_requests")
    .update({
        status:"admin_approved",
        admin_decision_at:new Date().toISOString()
    })
    .eq("id",id);

if (error) {
    alert(error.message);
    return;
}

await loadSchedule();
await loadRequests();

renderRequests();
```

}

async function saveScheduleRow(employee,date,shiftType) {

}

return true;

async function saveAllSchedule() {
const entries = Object.entries(pendingEditorChanges);

```
if (!entries.length) {
    alert("Няма промени за запис.");
    return;
}

const button =
    document.querySelector(".save-bar button");

if (button) {
    button.disabled = true;
    button.textContent = "Записване...";
}

let failed = 0;

for (const [key,value] of entries) {
    const [employee,date] = key.split("|");

    const ok = await saveScheduleRow(
        employee,
        date,
        value
    );

    if (!ok) failed++;
}

if (button) {
    button.disabled = false;
    button.textContent = "💾 Запази всички промени";
}

if (failed) {
    alert(`Записването приключи с ${failed} грешки.`);
} else {
    alert("Графикът е записан успешно.");
}

pendingEditorChanges = {};

await loadSchedule();

renderAdminSchedule();
```

}
